<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貨車記帳助手</title>
    <!-- 引入 Tailwind CSS 確保樣式正確 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React/ReactDOM/Babel (重要: 確保正確載入順序) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 確保字體和介面清晰 */
        body { font-family: "Inter", sans-serif; }
        /* 針對整個 App 容器，限制最大寬度以模擬手機介面 */
        #root { 
            max-width: 480px; 
            margin: 0 auto; 
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            min-height: 100vh;
        }
        /* 讓載入圖標轉動 */
        .loader-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        /* 修正日期輸入框在某些瀏覽器上的預設高度 */
        input[type="date"] {
            min-height: 44px; /* 確保在 mobile 上有足夠點擊區域 */
        }
        /* 月曆日期數字和指標的微調，以保持緊湊 */
        .calendar-day-content {
            padding-top: 0.5rem; /* pt-2 */
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Lucide Icons (使用 SVG 確保不用額外安裝套件) ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                ChevronLeft: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
                ChevronRight: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
                Plus: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>,
                // 【修正 2】更換 Settings 圖示為 Sliders
                Sliders: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>,
                Truck: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 18H3c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v10h4c1.1 0 2 .9 2 2v1c0 1.1-.9 2-2 2h-1c-.5 0-1-.2-1.4-.6L17 19h-1.4c-.4.4-1.2.6-1.6.6H5c-.5 0-1-.2-1.4-.6L2.6 19H3c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h2zm11 2a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM7 20a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>,
                Package: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.16"/><path d="m7.5 19.73 9-5.16"/><path d="M3.29 7.33l7.98-4.58a1 1 0 0 1 1.44 0l7.98 4.58a1 1 0 0 1 .5 1.05v7.24a1 1 0 0 1-.5 1.05l-7.98 4.58a1 1 0 0 1-1.44 0l-7.98-4.58a1 1 0 0 1-.5-1.05V8.38a1 1 0 0 1 .5-1.05z"/><path d="M12 22v-8"/><path d="M12 10V2"/></svg>,
                MapPin: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>,
                Trash2: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
                Save: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
                LogOut: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
                Search: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
                Download: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
                DollarSign: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
                RefreshCw: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinecap="round"><path d="M21 2v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 8"/></svg>,
                CheckCircle: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>,
                AlertCircle: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
                Loader2: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.5 2v3h-3"/><path d="M21.5 10a9.5 9.5 0 1 1-8.5-8.5"/></svg>,
                Fuel: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2v20h18v-2.12c0-1.2-1-2.08-2.22-2.32L14 17V8a2 2 0 0 0-2-2h-3a2 2 0 0 0-2 2v7.72L5.22 19.88C4.01 20.12 3 21.05 3 22V2h18"/></svg>,
                Receipt: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2h-2m-2 4h-4m4 4h-4m4 4h-4m-4 0h-4m-4-4h-4m0-4h-4m0-4h-4"/></svg>,
                ScrollText: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12s-1-5-6-5-6 5-6 5m0 0 1-4m-1 4-1 4m8-4h-6m4 4h-6m4 4h-6M12 22h10"/></svg>,
                Scale: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16.5 3.5 3.5m-15-7 3.5 3.5m5-10v16M21 16.5c-3.5-3.5-8-3-8 0v4H8c-3.5 0-4.5-3-8 0M12 12V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v9M7 12V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v9"/></svg>,
                HelpCircle: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
            };
            const SVGComponent = icons[name];
            if (!SVGComponent) return null;
            return <SVGComponent width={size} height={size} className={className} />;
        };

        // --- 設定常數與輔助函式 ---
        const STORAGE_URL_KEY = 'truck_bookkeeping_url';
        const STORAGE_CACHE_KEY = 'truck_bookkeeping_cache';

        const initialData = {};
        
        // 增加顯示設定預設值
        const initialSettings = { 
          pricePerTon: 500, // 每噸單價
          dropThreshold: 1, // 免加價位數
          dropSurcharge: 200, // 超過後的加價金額
          displayMetrics: {
              showDailyIncome: true,
              showDailyNetIncome: true,
              showDailyWeight: false,
          }
        };

        // 取得日期 key
        const getDateKey = (date) => {
          if (!date) return '';
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const day = String(date.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        };

        /**
         * 計算單筆交易的淨值 (收入為正，支出為負)。
         * 注意：這裡不再計算單筆的加價費用，因為加價是依據**總位數**計算。
         * 這裡只計算單筆的**基本**噸數運費。
         */
        const calculateEntryNetValue = (entry, settings) => {
            if (entry.type === 'fuel') {
                // 支出為負值
                return -(parseFloat(entry.amount) || 0);
            }
            if (entry.type === 'delivery') {
                const weight = parseFloat(entry.weight) || 0;
                // 單筆交易的收入只計算基本運費
                const weightCost = weight * settings.pricePerTon; 
                return Math.round(weightCost);
            }
            return 0;
        };

        /**
         * 計算單日的所有指標 (用於日曆畫面顯示)
         * 此函數現在負責計算每日總位數、總收入（含總位數加價）和總支出。
         */
        const calculateDayMetrics = (dateKey, data, settings) => {
            const entries = data[dateKey]?.entries || [];
            
            let totalBasicIncome = 0; // 僅噸數產生的基本收入
            let totalExpense = 0;
            let totalWeight = 0;
            let totalDrops = 0; // 每日總位數

            entries.forEach(entry => {
                if (entry.type === 'delivery') {
                    const weight = parseFloat(entry.weight) || 0;
                    const drops = parseInt(entry.dropLocations) || 0;
                    
                    totalBasicIncome += (weight * settings.pricePerTon);
                    totalWeight += weight;
                    totalDrops += drops; // 累計每日總位數
                } else if (entry.type === 'fuel') {
                    totalExpense += (parseFloat(entry.amount) || 0);
                }
            });
            
            // 根據每日總位數計算加價費用
            const extraDrops = Math.max(0, totalDrops - settings.dropThreshold);
            const surchargeCost = extraDrops * settings.dropSurcharge;
            
            // 每日總收入 = 基本運費 + 總位數加價
            const totalIncome = Math.round(totalBasicIncome + surchargeCost);
            const totalNetIncome = totalIncome - totalExpense;

            return {
                dailyIncome: totalIncome,
                dailyNetIncome: totalNetIncome,
                dailyWeight: totalWeight,
                dailyDrops: totalDrops, // 新增每日總位數，方便匯出時計算
                surchargeCost: surchargeCost, // 新增總加價費用
                hasData: entries.length > 0
            };
        };

        /**
         * 計算單筆送貨的細節。
         * 此函數目前只用於顯示單筆交易的基本收入。
         */
        const calculateDeliveryDetails = (entry, settings) => {
            const weight = parseFloat(entry.weight) || 0;
            const drops = parseInt(entry.dropLocations) || 0;
            const weightCost = Math.round(weight * settings.pricePerTon);
            
            const surchargeCost = 0; 
            const totalIncome = weightCost; // 單筆收入只包含基本運費
            
            return { weightCost, extraDrops: 0, surchargeCost, totalIncome };
        };
        
        // 可重複使用的 Checkbox 組件
        const CheckboxItem = ({ label, checked, onChange, helpText }) => (
            <label className="flex items-start cursor-pointer p-2 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
                <input type="checkbox" checked={checked} onChange={onChange} className="mt-1 mr-3 w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500" />
                <div className="flex flex-col">
                    <span className="text-sm font-medium text-gray-700">{label}</span>
                    <span className="text-xs text-gray-400">{helpText}</span>
                </div>
            </label>
        );
        
        /**
         * 月曆顯示指標組件：移除文字標籤，只顯示數值和單位。
         */
        function DailyMetric({ value, label, unit, isPositive, color, precision = 0 }) {
            // 噸數為 0 時也允許顯示
            if (value === 0 && label === '噸數') {
                value = 0;
            } else if (value === 0) {
                return null;
            } 

            let valueText;
            if (precision > 0) {
                // 移除數字中的逗號（千位分隔符）
                valueText = parseFloat(value).toFixed(precision).replace(/,/g, '');
            } else {
                valueText = Math.abs(value).toLocaleString('en-US').replace(/,/g, ''); // 移除千位分隔符
            }

            const colorMap = {
                green: isPositive ? 'text-green-600' : 'text-gray-500', // 收入
                blue: isPositive ? 'text-blue-600' : 'text-red-600',   // 淨收入
                orange: 'text-orange-600',                              // 噸數
            };
            
            const valueClass = colorMap[color] || 'text-gray-600';

            return (
                <div className="flex flex-col items-center leading-tight">
                    <span className={`block text-[11px] font-bold ${valueClass}`}>
                        {label !== '噸數' && (isPositive ? '' : '-')}
                        {valueText}
                        <span className="text-[9px] ml-0.5 font-normal text-gray-500">{unit}</span>
                    </span>
                    {/* 移除文字標籤 */}
                </div>
            );
        }

        // --- 主應用程式元件 ---

        const App = () => {
          const [view, setView] = useState('loading');
          const [currentDate, setCurrentDate] = useState(new Date());
          const [googleUrl, setGoogleUrl] = useState('');
          const [data, setData] = useState(initialData);
          // 初始化 settings 時，確保 displayMetrics 存在
          const [settings, setSettings] = useState(initialSettings);
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [isSearchOpen, setIsSearchOpen] = useState(false);
          const [isDownloadOpen, setIsDownloadOpen] = useState(false);
          const [syncStatus, setSyncStatus] = useState('idle');
          const [loginError, setLoginError] = useState('');
          const [showTransactionModal, setShowTransactionModal] = useState(false);
          const [transactionType, setTransactionType] = useState('delivery'); 
          const [editingEntry, setEditingEntry] = useState(null);
          const [showMenuModal, setShowMenuModal] = useState(false);


          // Google Sync 函數
          const fetchFromGoogle = async (url, isAutoLogin = false) => {
            if (!url) return;
            setSyncStatus('syncing');
            setLoginError('');
            
            try {
              const response = await fetch(url);
              const text = await response.text(); 
              let cloudPayload;
              try {
                cloudPayload = JSON.parse(text);
              } catch (e) {
                console.error("Invalid JSON response:", text);
                throw new Error('Script 執行錯誤或回傳格式錯誤。');
              }

              if (cloudPayload && !cloudPayload.status) { 
                 const newData = cloudPayload.data || {};
                 const newSettings = cloudPayload.settings || {};
                 
                 // 確保新的設定值有預設的 displayMetrics
                 const mergedSettings = { 
                     ...initialSettings, 
                     ...newSettings,
                     displayMetrics: { ...initialSettings.displayMetrics, ...newSettings.displayMetrics }
                 };
                 
                 setData(newData);
                 setSettings(mergedSettings);
                 localStorage.setItem(STORAGE_URL_KEY, url);
                 localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify({ data: newData, settings: mergedSettings }));
                 setSyncStatus('success');
                 setView('calendar');
                 setTimeout(() => setSyncStatus('idle'), 2000);
              } else if (cloudPayload.status === 'error') {
                 throw new Error(`腳本錯誤: ${cloudPayload.error}`);
              } else {
                 throw new Error('未知的雲端錯誤。');
              }
            } catch (error) {
              console.error("Sync Error:", error.message);
              setSyncStatus('error');
              if (!isAutoLogin) {
                setLoginError(`連線失敗: ${error.message || '請檢查網址是否正確'}`);
              }
              // 即使自動登入失敗，也允許進入日曆頁面使用快取
              if (isAutoLogin && view === 'loading') {
                 setView('calendar');
              }
            }
          };

          const saveDataAndSettings = async (newData, newSettings) => {
            // 確保儲存時 settings 結構是完整的
            const settingsToSave = {
                ...initialSettings, 
                ...newSettings,
                displayMetrics: { ...initialSettings.displayMetrics, ...newSettings.displayMetrics }
            };
            
            setData(newData);
            setSettings(settingsToSave);
            localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify({ data: newData, settings: settingsToSave }));

            if (googleUrl) {
              setSyncStatus('syncing');
              try {
                // 發送 POST 請求到 Google Script
                await fetch(googleUrl, {
                  method: 'POST',
                  mode: 'no-cors', // 允許跨域，雖然無法讀取響應
                  headers: { 'Content-Type': 'text/plain' },
                  body: JSON.stringify({ data: newData, settings: settingsToSave })
                });
                // 由於是 no-cors，無法確認成功，假設成功
                setSyncStatus('success');
                setTimeout(() => setSyncStatus('idle'), 2000);
              } catch (error) {
                console.error("Save Error:", error);
                setSyncStatus('error');
              }
            }
          };

          // 初始化效果
          useEffect(() => {
            const savedUrl = localStorage.getItem(STORAGE_URL_KEY);
            const savedCache = localStorage.getItem(STORAGE_CACHE_KEY);

            if (savedCache) {
              try {
                const parsed = JSON.parse(savedCache);
                if (parsed.data) setData(parsed.data);
                // 讀取快取時也進行結構合併
                if (parsed.settings) {
                    setSettings({ 
                        ...initialSettings, 
                        ...parsed.settings,
                        displayMetrics: { ...initialSettings.displayMetrics, ...parsed.settings.displayMetrics }
                    });
                }
              } catch (e) {
                console.error("Failed to parse cache", e);
              }
            }

            if (savedUrl) {
              setGoogleUrl(savedUrl);
              fetchFromGoogle(savedUrl, true); 
            } else {
              setView('login');
            }
          }, []);

          // 處理交易儲存和刪除
          const handleSaveTransaction = (entry) => {
            const dateKey = getDateKey(currentDate);
            // 修正：必須使用 currentDayData.entries 來確保它是 Array，而不是直接讀取 data[dateKey].entries
            const currentDayData = data[dateKey] || { entries: [] }; 
            let newEntries;

            if (editingEntry) {
              newEntries = currentDayData.entries.map(e => e.id === editingEntry.id ? entry : e);
            } else {
              newEntries = [...currentDayData.entries, { ...entry, id: Date.now().toString(), type: transactionType }];
            }

            const newData = { ...data, [dateKey]: { ...currentDayData, entries: newEntries } };
            saveDataAndSettings(newData, settings);
            setShowTransactionModal(false); setEditingEntry(null); setTransactionType('delivery');
          };
          
          const handleDeleteTransaction = (id) => {
             // 使用自定義 modal 替換 window.confirm
             const isConfirmed = window.confirm('確定刪除此筆紀錄？'); 
             if(isConfirmed) {
                const dateKey = getDateKey(currentDate);
                const currentDayData = data[dateKey] || { entries: [] };
                const newEntries = currentDayData.entries.filter(e => e.id !== id);
                const newData = { ...data, [dateKey]: { ...currentDayData, entries: newEntries } };
                saveDataAndSettings(newData, settings);
                setShowTransactionModal(false); setEditingEntry(null); setTransactionType('delivery');
             }
          };

          const handleLogout = () => {
            const isConfirmed = window.confirm('確定要登出嗎？這會清除此裝置的自動登入紀錄。');
            if(isConfirmed) {
              localStorage.removeItem(STORAGE_URL_KEY);
              localStorage.removeItem(STORAGE_CACHE_KEY);
              setGoogleUrl('');
              setData(initialData);
              setSettings(initialSettings);
              setView('login');
            }
          };

          const renderView = () => {
            switch (view) {
              case 'loading': 
                return <div className="h-screen flex items-center justify-center bg-white"><Icon name="Loader2" className="loader-spin text-blue-600" size={40}/></div>;
              case 'login': 
                return <LoginView onLogin={(url) => { setGoogleUrl(url); fetchFromGoogle(url); }} error={loginError} loading={syncStatus === 'syncing'} />;
              case 'calendar':
                return (
                  <CalendarView 
                    currentDate={currentDate} 
                    setCurrentDate={setCurrentDate}
                    data={data}
                    syncStatus={syncStatus}
                    onSelectDate={(date) => { setCurrentDate(date); setView('detail'); }}
                    openSettings={() => setIsSettingsOpen(true)}
                    openSearch={() => setIsSearchOpen(true)}
                    openDownload={() => setIsDownloadOpen(true)}
                    onLogout={handleLogout}
                    onRefresh={() => fetchFromGoogle(googleUrl)}
                    settings={settings}
                  />
                );
              case 'detail':
                return (
                  <DetailView 
                    date={currentDate}
                    data={data[getDateKey(currentDate)] || { entries: [] }}
                    dayMetrics={calculateDayMetrics(getDateKey(currentDate), data, settings)} // 傳入每日計算指標
                    onBack={() => setView('calendar')}
                    onChangeDate={(days) => {
                        const d = new Date(currentDate); d.setDate(d.getDate()+days); setCurrentDate(d);
                    }}
                    settings={settings}
                    calculateEntryNetValue={calculateEntryNetValue}
                    showTransactionModal={showTransactionModal}
                    setShowTransactionModal={setShowTransactionModal}
                    transactionType={transactionType}
                    setTransactionType={setTransactionType}
                    editingEntry={editingEntry}
                    setEditingEntry={setEditingEntry}
                    onSave={handleSaveTransaction}
                    onDelete={handleDeleteTransaction}
                    showMenuModal={showMenuModal}
                    setShowMenuModal={setShowMenuModal}
                  />
                );
              default: return null;
            }
          };

          return (
            <div className="min-h-screen bg-gray-100 font-sans text-gray-900 relative overflow-hidden shadow-2xl border-x border-gray-200">
              {renderView()}
              {isSettingsOpen && <SettingsModal settings={settings} onSave={(newSettings) => { saveDataAndSettings(data, newSettings); setIsSettingsOpen(false); }} onClose={() => setIsSettingsOpen(false)} />}
              {isSearchOpen && <SearchModal data={data} onClose={() => setIsSearchOpen(false)} onSelectResult={(d) => { setCurrentDate(new Date(d)); setIsSearchOpen(false); setView('detail'); }} />}
              {isDownloadOpen && <DownloadModal data={data} settings={settings} onClose={() => setIsDownloadOpen(false)} calculateDeliveryDetails={calculateDeliveryDetails} calculateDayMetrics={calculateDayMetrics} />}
            </div>
          );
        }

        // --- 登入畫面 (LoginView) ---
        function LoginView({ onLogin, error, loading }) {
            const [url, setUrl] = useState('');
            const [showHelp, setShowHelp] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (url) onLogin(url);
            };

            return (
                <div className="h-screen flex flex-col items-center justify-center p-6 bg-white">
                    <div className="text-center mb-10">
                        <Icon name="Truck" size={60} className="text-blue-600 mx-auto mb-2"/>
                        <h1 className="text-3xl font-bold text-gray-800">貨車記帳助手</h1>
                        <p className="text-gray-500 mt-2">請貼上您的 Google App Script URL 以同步資料。</p>
                    </div>
                    
                    <form onSubmit={handleSubmit} className="w-full max-w-xs space-y-4">
                        <div className="relative">
                            <input
                                type="url"
                                value={url}
                                onChange={(e) => setUrl(e.target.value)}
                                placeholder="貼上 Google Script URL"
                                required
                                className="w-full p-3 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-blue-500 outline-none transition"
                            />
                            {/* 新增教學按鈕 */}
                            <button type="button" onClick={() => setShowHelp(true)} className="absolute right-0 top-0 h-full px-3 text-blue-500 hover:text-blue-700">
                                <Icon name="HelpCircle" size={20} />
                            </button>
                        </div>
                        
                        {error && <div className="text-red-500 text-sm p-2 bg-red-50 rounded-lg">{error}</div>}
                        <button
                            type="submit"
                            disabled={loading}
                            className={`w-full py-3 rounded-lg font-bold text-white transition-colors flex items-center justify-center gap-2 ${
                                loading ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-200'
                            }`}
                        >
                            {loading ? (<><Icon name="Loader2" size={20} className="loader-spin"/> 連線中...</>) : '開始記帳'}
                        </button>
                    </form>
                    <p className="text-xs text-gray-400 mt-10">資料儲存於您的 Google Sheet 中。</p>

                    {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}
                </div>
            );
        }
        
        // --- 教學 Modal (HelpModal) ---
        function HelpModal({ onClose }) {
            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                        <h3 className="text-xl font-bold mb-4 text-gray-800 flex items-center gap-2"><Icon name="HelpCircle" size={20} className="text-blue-500"/> Google Script 建立教學</h3>
                        
                        <div className="space-y-4 text-sm text-gray-700">
                            <p>要啟用雲端同步，您需要將我提供的 **Google Apps Script** 部署到您的試算表中。</p>
                            
                            <h4 className="font-bold text-base mt-3">步驟 1: 建立試算表</h4>
                            <p>請先確保您已經有要儲存資料的 Google 試算表（例如：您提供的 ID 為 `108ke0XuHOKPf6MoXwONWBDr1AA_puzExckGB0wup_KU` 的文件）。</p>

                            <h4 className="font-bold text-base mt-3">步驟 2: 部署 Apps Script</h4>
                            <ol className="list-decimal list-inside pl-4 space-y-2 bg-gray-50 p-3 rounded-lg">
                                <li>在試算表中，點選 **「擴充功能 (Extensions)」** > **「Apps Script」**。</li>
                                <li>清空編輯器中原本的內容，並貼上我在聊天記錄中提供給您的 **Google Apps Script 程式碼**。</li>
                                <li>點選右上角的 **「部署 (Deploy)」** > **「新增部署 (New deployment)」**。</li>
                                <li>選擇類型為 **「網頁應用程式 (Web app)」**。</li>
                                <li>**重要設定:**
                                    <ul className="list-disc list-inside pl-4 text-red-600">
                                        <li>執行身分 (Execute as)：**我 (Me)**</li>
                                        <li>誰可以存取 (Who has access)：**任何人 (Anyone)**</li>
                                    </ul>
                                </li>
                                <li>點選 **「部署」** 並授權存取試算表。</li>
                            </ol>
                            
                            <h4 className="font-bold text-base mt-3">步驟 3: 複製網址</h4>
                            <p>部署完成後，會出現一個彈窗，請複製 **「網頁應用程式網址 (Web App URL)」** (通常以 `https://script.google.com/macros/s/...` 開頭)。</p>
                            
                            <h4 className="font-bold text-base mt-3">步驟 4: 回到 App</h4>
                            <p>將該網址貼入登入畫面的輸入框即可完成連線。</p>

                        </div>

                        <button onClick={onClose} className="w-full py-3 mt-6 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700">關閉</button>
                    </div>
                </div>
            );
        }

        // --- 月曆畫面 (CalendarView) ---
        function CalendarView({ currentDate, setCurrentDate, data, onSelectDate, openSettings, openSearch, openDownload, onLogout, syncStatus, onRefresh, settings }) {
          const year = currentDate.getFullYear();
          const month = currentDate.getMonth();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const firstDayOfMonth = new Date(year, month, 1).getDay(); 

          const changeMonth = (delta) => setCurrentDate(new Date(year, month + delta, 1));
          
          const days = [];
          for (let i = 0; i < firstDayOfMonth; i++) days.push(null);
          for (let i = 1; i <= daysInMonth; i++) days.push(i);

          return (
            <div className="h-screen flex flex-col bg-white">
              <div className="px-4 py-4 bg-white border-b border-gray-100 flex justify-between items-center sticky top-0 z-10">
                <div className="flex items-center gap-2">
                   <button onClick={onLogout} className="p-2 text-gray-400 hover:text-red-500 transition-colors"><Icon name="LogOut" size={20}/></button>
                   <div>
                     <h2 className="text-xl font-bold text-gray-800 leading-tight">{year}年 {month + 1}月</h2>
                     {/* 移除了月總噸數，只保留同步狀態 */}
                     <div className="flex items-center gap-1 text-[10px] font-medium h-4">
                        {syncStatus === 'idle' && <span className="text-gray-400 flex items-center gap-1"><Icon name="CheckCircle" size={10}/> 雲端已同步</span>}
                        {syncStatus === 'syncing' && <span className="text-blue-500 flex items-center gap-1"><Icon name="RefreshCw" size={10} className="loader-spin"/> 同步中...</span>}
                        {syncStatus === 'error' && <span className="text-red-500 flex items-center gap-1"><Icon name="AlertCircle" size={10}/> 同步失敗</span>}
                        {syncStatus === 'success' && <span className="text-green-500 flex items-center gap-1"><Icon name="CheckCircle" size={10}/> 儲存成功</span>}
                     </div>
                   </div>
                </div>
                <div className="flex items-center gap-1">
                  <button onClick={onRefresh} className="p-2 text-gray-400 hover:bg-gray-50 rounded-full"><Icon name="RefreshCw" size={18} /></button>
                  <button onClick={() => changeMonth(-1)} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200"><Icon name="ChevronLeft" size={20} /></button>
                  <button onClick={() => changeMonth(1)} className="p-2 bg-gray-100 rounded-full hover:bg-gray-200"><Icon name="ChevronRight" size={20} /></button>
                  <div className="w-px h-6 bg-gray-200 mx-1"></div>
                  <button onClick={openDownload} className="p-2 text-green-600 bg-green-50 rounded-full hover:bg-green-100"><Icon name="Download" size={20} /></button>
                  <button onClick={openSearch} className="p-2 text-blue-600 bg-blue-50 rounded-full hover:bg-blue-100"><Icon name="Search" size={20} /></button>
                  {/* 【修正 2】使用新的 Sliders 圖示 */}
                  <button onClick={openSettings} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full"><Icon name="Sliders" size={20} /></button>
                </div>
              </div>
              <div className="grid grid-cols-7 gap-1 px-2 py-2 mb-2">
                {['日', '一', '二', '三', '四', '五', '六'].map(d => (
                  <div key={d} className="text-center text-xs text-gray-400 font-medium">{d}</div>
                ))}
              </div>
              <div className="grid grid-cols-7 gap-2 px-2 pb-20 overflow-y-auto flex-1">
                {days.map((day, index) => {
                  if (!day) return <div key={`empty-${index}`} className="aspect-square" />;
                  
                  const dateKey = getDateKey(new Date(year, month, day));
                  const metrics = calculateDayMetrics(dateKey, data, settings); // 計算所有指標
                  
                  const isToday = getDateKey(new Date()) === dateKey;
                  const hasData = metrics.hasData;

                  return (
                    <button
                      key={day}
                      onClick={() => onSelectDate(new Date(year, month, day))}
                      className={`aspect-square rounded-xl flex flex-col items-center justify-start relative transition-all ${isToday ? 'bg-blue-50 border-2 border-blue-500' : 'bg-gray-50 hover:bg-gray-100 border border-transparent'}`}
                    >
                      <div className="calendar-day-content">
                          <span className={`text-sm font-semibold ${isToday ? 'text-blue-600' : 'text-gray-700'}`}>{day}</span>
                          
                          {/* 根據設定顯示動態指標 */}
                          {hasData && (
                              <div className="mt-1 space-y-[2px]">
                                  {settings.displayMetrics.showDailyIncome && (
                                      // label 保持原樣傳入，但在 DailyMetric 內部不顯示
                                      <DailyMetric value={metrics.dailyIncome} label="收入" unit="$" isPositive={metrics.dailyIncome >= 0} color="green" />
                                  )}
                                  {settings.displayMetrics.showDailyNetIncome && (
                                      // label 保持原樣傳入，但在 DailyMetric 內部不顯示
                                      <DailyMetric value={metrics.dailyNetIncome} label="淨收入" unit="$" isPositive={metrics.dailyNetIncome >= 0} color="blue" />
                                  )}
                                  {settings.displayMetrics.showDailyWeight && (
                                      // label 保持原樣傳入，但在 DailyMetric 內部不顯示
                                      <DailyMetric value={metrics.dailyWeight} label="噸數" unit="噸" isPositive={true} color="orange" precision={2} />
                                  )}
                              </div>
                          )}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          );
        }

        // --- 每日畫面 (DetailView) ---
        function DetailView({ date, data, onBack, onChangeDate, settings, dayMetrics, calculateEntryNetValue, showTransactionModal, setShowTransactionModal, transactionType, setTransactionType, editingEntry, setEditingEntry, onSave, onDelete, showMenuModal, setShowMenuModal }) {
          
          const formattedDate = `${date.getFullYear()} / ${date.getMonth() + 1} / ${date.getDate()}`;

          // 使用 dayMetrics (已在 App 傳入，包含每日總位數加價)
          const totalIncome = dayMetrics.dailyIncome;
          const totalExpense = Math.abs(dayMetrics.dailyIncome - dayMetrics.dailyNetIncome);
          const totalNetEarnings = dayMetrics.dailyNetIncome;
          const totalWeight = dayMetrics.dailyWeight.toFixed(2); // 來自 dayMetrics
          const totalDrops = dayMetrics.dailyDrops; // 來自 dayMetrics

          const handleOpenAddMenu = () => {
              setEditingEntry(null);
              setTransactionType('delivery');
              setShowMenuModal(true);
          };

          const handleSelectType = (type) => {
              setTransactionType(type);
              setShowMenuModal(false);
              setShowTransactionModal(true);
          };

          const handleEdit = (entry) => {
              setEditingEntry(entry);
              setTransactionType(entry.type);
              setShowTransactionModal(true);
          };
          
          // 每日畫面總收入下方備註內容修正
          const secondaryInfo = `${totalWeight} 噸 ( ${totalDrops} 位 )`;


          return (
            <div className="h-screen flex flex-col bg-gray-100">
              <div className="bg-blue-600 text-white pt-4 pb-4 px-4 shadow-md z-20">
                <div className="flex justify-between items-center mt-2">
                  <button onClick={onBack} className="flex items-center text-blue-100 hover:text-white"><Icon name="ChevronLeft" size={20} /> 返回</button>
                  <div className="flex gap-4">
                     <button onClick={() => onChangeDate(-1)} className="p-1 hover:bg-blue-700 rounded"><Icon name="ChevronLeft" size={24}/></button>
                     <button onClick={() => onChangeDate(1)} className="p-1 hover:bg-blue-700 rounded"><Icon name="ChevronRight" size={24}/></button>
                  </div>
                </div>
                <div className="mt-4 text-center">
                    <h2 className="text-2xl font-bold">{formattedDate}</h2>
                    <div className="text-blue-200 text-xs mt-1 flex justify-center gap-2">
                      <span>${settings.pricePerTon}/噸</span>
                      <span>•</span>
                      <span>超{settings.dropThreshold}位+${settings.dropSurcharge}</span>
                    </div>
                </div>
              </div>

              <div className="bg-white p-4 shadow-sm z-10 grid grid-cols-3 gap-3 border-b border-gray-200">
                {/* 總收入卡片使用修正後的 secondaryInfo */}
                <SummaryCard title="總收入" value={totalIncome} secondaryValue={secondaryInfo} color="green" icon="DollarSign" secondaryIcon="Scale" />
                <SummaryCard title="總支出" value={totalExpense} color="red" icon="Fuel" />
                <SummaryCard title="淨收入" value={totalNetEarnings} color="blue" icon="Receipt" />
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-3 pb-24">
                {data.entries.length === 0 ? (
                  <div className="text-center text-gray-400 mt-10"><Icon name="Package" className="w-12 h-12 mx-auto mb-2 opacity-20" /><p>無資料</p></div>
                ) : (
                  data.entries.sort((a,b) => b.id - a.id).map(entry => {
                    // 這裡的 netValue 只會顯示單筆的基本噸數運費 (因為總位數加價是整日收入)
                    const netValue = calculateEntryNetValue(entry, settings); 
                    return (
                        <EntryCard 
                            key={entry.id} 
                            entry={entry} 
                            netValue={netValue} // 顯示單筆基本收入或支出
                            settings={settings}
                            onEdit={handleEdit}
                        />
                    );
                  })
                )}
              </div>

              <button onClick={handleOpenAddMenu} className="fixed bottom-6 right-6 bg-blue-600 text-white p-4 rounded-full shadow-lg shadow-blue-600/40 hover:bg-blue-700 active:scale-90 transition-all z-30"><Icon name="Plus" size={28} /></button>

              {showMenuModal && <MenuModal onSelect={handleSelectType} onClose={() => setShowMenuModal(false)} />}
              {showTransactionModal && (
                <TransactionModal 
                    initialValues={editingEntry} 
                    transactionType={transactionType}
                    onClose={() => { setShowTransactionModal(false); setEditingEntry(null); setTransactionType('delivery'); }} 
                    onSave={onSave} 
                    onDelete={editingEntry ? () => onDelete(editingEntry.id) : null} 
                />
              )}
            </div>
          );
        }
        
        // 總覽卡片元件
        function SummaryCard({ title, value, secondaryValue, color, icon, secondaryIcon }) {
            // 總收入卡片金額不使用逗號
            const displayValue = Math.abs(value).toLocaleString('en-US').replace(/,/g, '');
            const isPositive = value >= 0;
            const colorMap = {
                green: { bg: 'bg-green-50', text: 'text-green-700', icon: 'text-green-500' },
                red: { bg: 'bg-red-50', text: 'text-red-700', icon: 'text-red-500' },
                blue: { bg: 'bg-blue-50', text: 'text-blue-700', icon: 'text-blue-500' },
            };
            const styles = colorMap[color];
            
            return (
                <div className={`${styles.bg} p-3 rounded-lg text-center`}>
                    <div className="flex justify-center items-center text-xs mb-1 uppercase tracking-wide text-gray-500">
                        <Icon name={icon} size={14} className={`mr-1 ${styles.icon}`} /> {title}
                    </div>
                    {/* 收入和淨收入顯示正負號，支出顯示絕對值 */}
                    <div className={`text-xl font-bold ${color === 'red' ? styles.text : isPositive ? styles.text : 'text-red-600'}`}>
                        {color === 'red' ? displayValue : (isPositive ? '' : '-') + displayValue}
                    </div>
                    {secondaryValue && (
                        <div className="text-xs text-gray-500 mt-1 flex items-center justify-center">
                            {secondaryValue}
                        </div>
                    )}
                </div>
            );
        }

        // 交易項目卡片元件
        function EntryCard({ entry, netValue, settings, onEdit }) {
            const isDelivery = entry.type === 'delivery';
            const isExpense = entry.type === 'fuel';
            
            // netValue 這裡只代表：送貨的基本運費（正值） 或 油錢支出（負值）
            const valueClass = isExpense ? 'text-red-600 bg-red-50' : 'text-green-600 bg-green-50';
            
            // 單筆金額不使用逗號
            const displayNetValue = Math.abs(netValue).toLocaleString('en-US').replace(/,/g, '');

            if (isDelivery) {
                const totalDrops = parseInt(entry.dropLocations) || 0;
                return (
                    <div onClick={() => onEdit(entry)} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 active:scale-[0.98] transition-transform cursor-pointer relative group">
                        <div className="flex justify-between items-start mb-2">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-100 p-2 rounded-full"><Icon name="Truck" size={16} className="text-blue-600"/></div>
                                <div>
                                    <h3 className="font-bold text-lg text-gray-800">{entry.clientName}</h3>
                                    <span className="text-xs text-gray-500">{entry.material} / {entry.packages} 包</span>
                                </div>
                            </div>
                            <div className="text-right">
                                <span className="text-2xl font-bold text-gray-800">{entry.weight}</span>
                                <span className="text-xs text-gray-500 ml-1">噸</span>
                            </div>
                        </div>
                        <div className="flex items-center justify-between text-sm text-gray-600 bg-gray-50 p-2 rounded-lg">
                            <div className="flex items-center gap-3">
                                <span className={`flex items-center gap-1 px-2 py-0.5 rounded text-xs ${totalDrops > settings.dropThreshold ? 'bg-orange-100 text-orange-600 font-bold' : 'bg-gray-100 text-gray-600'}`}>
                                    <Icon name="MapPin" size={10} /> {totalDrops} 位
                                
                                </span>
                                {entry.remark && <span className="text-gray-500 text-xs truncate">備註: {entry.remark}</span>}
                            </div>
                            {/* 這裡顯示的是單筆的基本運費 (netValue)，而非總收入，因總加價已歸納到總收入卡片 */}
                            <div className={`font-semibold px-3 py-1 rounded-full ${valueClass}`}>
                                {netValue > 0 ? `+${displayNetValue}` : '$-' }
                            </div>
                        </div>
                    </div>
                );
            } else if (entry.type === 'fuel') {
                return (
                    <div onClick={() => onEdit(entry)} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 active:scale-[0.98] transition-transform cursor-pointer relative group">
                        <div className="flex justify-between items-start mb-2">
                            <div className="flex items-center gap-2">
                                <div className="bg-red-100 p-2 rounded-full"><Icon name="Fuel" size={16} className="text-red-600"/></div>
                                <div>
                                    <h3 className="font-bold text-lg text-gray-800">油錢支出</h3>
                                </div>
                            </div>
                            <div className="text-right">
                                {/* 支出顯示絕對值 */}
                                <div className={`font-semibold text-2xl ${valueClass}`}>{displayNetValue}</div> 
                            </div>
                        </div>
                        <div className="text-sm text-gray-600 bg-gray-50 p-2 rounded-lg"><Icon name="ScrollText" size={14} className="inline-block mr-1 text-gray-400"/> {entry.remark || '無備註'}</div>
                    </div>
                );
            }
            return null;
        }

        // 交易類型選擇選單
        function MenuModal({ onSelect, onClose }) {
            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end justify-center p-4 animate-fade-in">
                    <div className="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-3">
                        <h3 className="text-xl font-bold mb-4 text-gray-800">選擇交易類型</h3>
                        
                        <button onClick={() => onSelect('delivery')} className="w-full flex items-center p-4 bg-blue-50 text-blue-700 rounded-xl font-semibold hover:bg-blue-100 transition-colors">
                            <Icon name="Truck" size={24} className="mr-3"/>
                            送貨資訊 (收入)
                        </button>
                        
                        <button onClick={() => onSelect('fuel')} className="w-full flex items-center p-4 bg-red-50 text-red-700 rounded-xl font-semibold hover:bg-red-100 transition-colors">
                            <Icon name="Fuel" size={24} className="mr-3"/>
                            油錢支出 (支出)
                        </button>

                        <button onClick={onClose} className="w-full py-3 mt-4 rounded-xl bg-gray-100 text-gray-600 font-bold">取消</button>
                    </div>
                </div>
            );
        }

        // 交易紀錄新增/編輯 Modal
        function TransactionModal({ initialValues, transactionType: type, onClose, onSave, onDelete }) {
          const isDelivery = type === 'delivery';
          
          // Helper to safely get a value as string, defaulting if null/undefined
          const safeString = (value, defaultValue = '') => {
             if (value === null || value === undefined || (typeof value === 'string' && value.trim() === '')) {
                 return defaultValue;
             }
             return value.toString();
          };
          
          // 1. 定義預設值
          const defaultDelivery = { clientName: '', material: '', packages: '0', weight: '', dropLocations: '0', remark: '', type: 'delivery' };
          const defaultFuel = { amount: '', remark: '', type: 'fuel' };

          // 2. 確保初始化狀態包含所有欄位，並將數字轉為字串以供 input 欄位使用 (修正備註遺失問題)
          const getInitialFormState = (initial) => {
             const defaults = isDelivery ? defaultDelivery : defaultFuel;
             
             // 合併現有值與預設值，確保所有 key 都存在
             let state = { ...defaults, ...initial };
             
             // 確保所有數字和備註欄位都轉換成字串
             if (isDelivery) {
                 state.packages = safeString(state.packages, '0');
                 state.weight = safeString(state.weight, '');
                 state.dropLocations = safeString(state.dropLocations, '0');
                 state.clientName = safeString(state.clientName, '');
                 state.material = safeString(state.material, '');
             } else {
                 state.amount = safeString(state.amount, '');
             }
             
             state.remark = safeString(state.remark, ''); 
             
             return state;
          };

          const [form, setForm] = useState(getInitialFormState(initialValues));

          const handleSubmit = (e) => {
            e.preventDefault();
            
            let savedForm = { ...form };
            if (isDelivery) {
              savedForm.packages = parseFloat(savedForm.packages) || 0;
              savedForm.weight = parseFloat(savedForm.weight) || 0;
              savedForm.dropLocations = parseInt(savedForm.dropLocations) || 0;
            } else {
              savedForm.amount = parseFloat(savedForm.amount) || 0;
            }

            onSave(savedForm);
          };

          const handleDropChange = (delta) => {
             const currentDrops = parseInt(form.dropLocations) || 0;
             const newDrops = Math.max(0, currentDrops + delta);
             setForm({...form, dropLocations: newDrops.toString()});
          }
          
          const handleInputChange = (e) => {
             const { name, value } = e.target;
             setForm({...form, [name]: value});
          }

          return (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4 animate-fade-in">
              <div className="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl">
                <h3 className="text-xl font-bold mb-4 text-gray-800">
                    {initialValues ? '編輯' : '新增'} 
                    {isDelivery ? '送貨資訊' : '油錢支出'}
                </h3>
                <form onSubmit={handleSubmit} className="space-y-3">
                  
                  {isDelivery ? (
                    // --- 送貨資訊表單 ---
                    <>
                      <div><label className="block text-xs text-gray-500 mb-1">客戶</label><input required className="w-full p-3 bg-gray-50 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none" name="clientName" value={form.clientName} onChange={handleInputChange} placeholder="客戶名稱" autoFocus /></div>
                      <div className="grid grid-cols-2 gap-3">
                        <div><label className="block text-xs text-gray-500 mb-1">料名</label><input required className="w-full p-3 bg-gray-50 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none" name="material" value={form.material} onChange={handleInputChange} /></div>
                        <div><label className="block text-xs text-gray-500 mb-1">包數</label><input type="number" name="packages" className="w-full p-3 bg-gray-50 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none" value={form.packages} onChange={handleInputChange} /></div>
                      </div>
                      <div>
                          <label className="block text-xs text-gray-500 mb-1 flex items-center gap-1">下貨位數 (最低 0) <Icon name="MapPin" size={12}/></label>
                          <div className="flex items-center gap-2">
                             <button type="button" className="p-3 bg-gray-100 rounded-lg hover:bg-gray-200" onClick={() => handleDropChange(-1)}>-</button>
                             <input type="number" name="dropLocations" min="0" className="w-full p-3 bg-gray-50 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none text-center" value={form.dropLocations} onChange={handleInputChange} />
                             <button type="button" className="p-3 bg-gray-100 rounded-lg hover:bg-gray-200" onClick={() => handleDropChange(1)}>+</button>
                          </div>
                      </div>
                      <div><label className="block text-xs text-gray-500 mb-1">重量 (噸)</label><input type="number" step="0.01" required className="w-full p-3 bg-blue-50 rounded-lg border border-blue-200 focus:ring-2 focus:ring-blue-500 outline-none text-lg font-bold text-blue-800 text-center" name="weight" value={form.weight} onChange={handleInputChange} /></div>
                    </>
                  ) : (
                    // --- 油錢支出表單 ---
                    <>
                      <div>
                          <label className="block text-xs text-gray-500 mb-1">支出金額 ($)</label>
                          <input type="number" name="amount" step="1" required className="w-full p-3 bg-red-50 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-500 outline-none text-lg font-bold text-red-800 text-center" value={form.amount} onChange={handleInputChange} placeholder="例如: 2000" />
                      </div>
                      
                    </>
                  )}
                  
                  {/* 備註欄位 */}
                  <div>
                      <label className="block text-xs text-gray-500 mb-1">備註/摘要</label>
                      <textarea name="remark" className="w-full p-3 bg-gray-50 rounded-lg border focus:ring-2 focus:ring-gray-500 outline-none" rows="2" value={form.remark} onChange={handleInputChange} placeholder={isDelivery ? '例如：客戶要求先送 A 料再送 B 料' : '例如：在中油環北站加油'}></textarea>
                  </div>


                  <div className="pt-4 flex gap-3">
                    {initialValues && <button type="button" onClick={onDelete} className="flex-1 py-3 rounded-xl bg-red-50 text-red-600 font-bold flex justify-center items-center hover:bg-red-100"><Icon name="Trash2" size={18} /></button>}
                    <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200">取消</button>
                    <button type="submit" className="flex-[2] py-3 rounded-xl bg-blue-600 text-white font-bold shadow-lg shadow-blue-200 flex justify-center items-center gap-2 hover:bg-blue-700"><Icon name="Save" size={18} /> 儲存</button>
                  </div>
                </form>
              </div>
            </div>
          );
        }

                    displayMetrics: { ...prev.displayMetrics, [key]: !prev.displayMetrics[key] }

            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                        <h3 className="text-xl font-bold mb-4 text-gray-800 flex items-center gap-2"><Icon name="Sliders" size={20} className="text-gray-500"/> 應用程式設定</h3>
                        
                        {/* 費用設定 */}
                        <div className="space-y-3 p-4 border rounded-xl bg-gray-50 mb-6">
                           <h4 className="text-sm font-bold text-gray-700 mb-3">費用計算設定 (每日總位數計價)</h4>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">每噸單價 ($)</label>
                                <input type="number" name="pricePerTon" step="1" required className="mt-1 w-full p-3 bg-white rounded-lg border focus:ring-blue-500 outline-none" value={form.pricePerTon} onChange={handleInputChange} />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">免加價位數</label>
                                    <input type="number" name="dropThreshold" step="1" min="0" required className="mt-1 w-full p-3 bg-white rounded-lg border focus:ring-blue-500 outline-none" value={form.dropThreshold} onChange={handleInputChange} />
                                    <p className="text-xs text-gray-400 mt-1">每日總位數超過此位數才會加價。</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">位數加價金額 ($)</label>
                                    <input type="number" name="dropSurcharge" step="1" required className="mt-1 w-full p-3 bg-white rounded-lg border focus:ring-blue-500 outline-none" value={form.dropSurcharge} onChange={handleInputChange} />
                                </div>
                            </div>
                        </div>

                        {/* 月曆顯示設定 (新功能) */}
                        <div className="space-y-3 p-4 border rounded-xl mb-6">
                           <h4 className="text-sm font-bold text-gray-700 mb-3">月曆每日資訊顯示設定 (僅顯示數值與單位)</h4>
                           <CheckboxItem 
                                label="總收入 ($)" 
                                checked={form.displayMetrics.showDailyIncome} 
                                onChange={() => handleMetricChange('showDailyIncome')}
                                helpText="在月曆上顯示當日送貨總收入 (綠色)。"
                           />
                           <CheckboxItem 
                                label="淨收入 ($)" 
                                checked={form.displayMetrics.showDailyNetIncome} 
                                onChange={() => handleMetricChange('showDailyNetIncome')}
                                helpText="在月曆上顯示當日淨收入 (收入 - 支出, 藍色/紅色)。"
                           />
                           <CheckboxItem 
                                label="總噸數 (噸)" 
                                checked={form.displayMetrics.showDailyWeight} 
                                onChange={() => handleMetricChange('showDailyWeight')}
                                helpText="在月曆上顯示當日送貨總重量 (橘色)。"
                           />
                        </div>


                        <div className="pt-4 flex gap-3">
                            <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200">取消</button>
                            <button type="submit" onClick={handleSubmit} className="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700">儲存設定</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 搜尋 Modal (SearchModal) ---
        function SearchModal({ data, onClose, onSelectResult }) {
            const [query, setQuery] = useState('');
            
            // 搜尋邏輯優化：將匹配的單筆紀錄與其日期一起返回
            const filteredResults = useMemo(() => {
                if (!query) return [];
                const searchLower = query.toLowerCase();
                const results = [];
                
                Object.keys(data).sort().reverse().forEach(dateKey => {
                    const entries = data[dateKey].entries || [];
                    
                    entries.forEach(entry => {
                        const isMatch = (entry.clientName && entry.clientName.toLowerCase().includes(searchLower)) ||
                                        (entry.material && entry.material.toLowerCase().includes(searchLower)) ||
                                        (entry.remark && entry.remark.toLowerCase().includes(searchLower));

                        if (isMatch) {
                            results.push({ dateKey, entry });
                        }
                    });
                });
                return results;
            }, [query, data]);

            return (
                <div className="fixed inset-0 bg-white z-50 flex flex-col p-4">
                    <div className="flex items-center mb-4">
                        <button onClick={onClose} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full"><Icon name="ChevronLeft" size={24}/></button>
                        <input
                            type="text"
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                            placeholder="搜尋客戶名、料名或備註..."
                            className="flex-1 ml-3 p-3 bg-gray-100 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none"
                            autoFocus
                        />
                    </div>
                    
                    <div className="flex-1 overflow-y-auto space-y-3 pb-10">
                        {query && filteredResults.length > 0 ? (
                            filteredResults.map((result, index) => {
                                const { dateKey, entry } = result;
                                const isDelivery = entry.type === 'delivery';

                                return (
                                    <div 
                                        key={index} 
                                        onClick={() => onSelectResult(dateKey)} 
                                        className="bg-white p-4 rounded-xl shadow-md border border-gray-100 hover:bg-blue-50 cursor-pointer transition-colors"
                                    >
                                        <h4 className="font-bold text-lg text-blue-600 mb-2 flex justify-between items-center">
                                            {dateKey}
                                            <Icon name={isDelivery ? 'Truck' : 'Fuel'} size={18} className={isDelivery ? 'text-green-500' : 'text-red-500'}/>
                                        </h4>
                                        
                                        {isDelivery ? (
                                            <div className="grid grid-cols-2 gap-x-2 gap-y-1 text-sm text-gray-700">
                                                <div className="truncate"><span className="text-gray-400 font-medium">客戶名:</span> {entry.clientName}</div>
                                                <div className="truncate"><span className="text-gray-400 font-medium">料名:</span> {entry.material}</div>
                                                <div className="truncate"><span className="text-gray-400 font-medium">包數:</span> {entry.packages} 包</div>
                                                <div className="truncate"><span className="text-gray-400 font-medium">位數:</span> {entry.dropLocations} 位</div>
                                                <div className="truncate col-span-2"><span className="text-gray-400 font-medium">重量:</span> {entry.weight} 噸</div>
                                                {/* 【修正 1】增加備註欄位 */}
                                                <div className="truncate col-span-2 text-xs pt-1 border-t border-gray-100 mt-1"><span className="text-gray-400 font-medium">備註:</span> {entry.remark || '無'}</div>
                                            </div>
                                        ) : (
                                            <div className="text-sm text-gray-700 space-y-1">
                                                <div className="truncate"><span className="text-gray-400 font-medium">支出金額:</span> ${entry.amount.toLocaleString('en-US').replace(/,/g, '')}</div>
                                                {/* 【修正 1】增加備註欄位 */}
                                                <div className="text-xs text-gray-500 truncate pt-1 border-t border-gray-100"><span className="text-gray-400 font-medium">備註:</span> {entry.remark || '無'}</div>
                                            </div>
                                        )}

                                    </div>
                                );
                            })
                        ) : query ? (
                            <p className="text-center text-gray-400 mt-10">找不到符合 "{query}" 的紀錄。</p>
                        ) : (
                            <p className="text-center text-gray-400 mt-10">開始輸入以搜尋交易紀錄...</p>
                        )}
                    </div>
                </div>
            );
        }

        /**
         * 報表匯出 Modal (DownloadModal)
         */
        function DownloadModal({ data, settings, onClose, calculateDeliveryDetails, calculateDayMetrics }) {
          const today = getDateKey(new Date());
          const [startDate, setStartDate] = useState(today.substring(0, 8) + '01');
          const [endDate, setEndDate] = useState(today);
          const [exportOptions, setExportOptions] = useState({
            includeSurcharge: true,
            includeExpense: true,
            includeTotalIncome: true, // 總收入 (包含所選期間總收入)
            includeNetIncome: true,    // 淨收入 (包含所選期間的淨收入)
            includeDailySurchargeAsSeparateEntry: true, // 新增選項：是否將每日總加價單獨列為一筆紀錄
          });

          const handleOptionChange = (key) => {
             setExportOptions(prev => ({ ...prev, [key]: !prev[key] }));
          };
          
          /**
           * 輔助函式：將數值轉換為 CSV 格式（移除千位分隔符）
           * @param {number|string} value - 原始數值
           * @returns {string} - 不含逗號的字串
           */
          const formatForCsv = (value) => {
              if (value === null || value === undefined || value === '') return '';
              const num = parseFloat(value);
              if (isNaN(num)) return String(value).replace(/,/g, ''); // 如果不是數字，移除可能存在的逗號
              // 數字：使用 toString() 並移除逗號
              return num.toString().replace(/,/g, '');
          };

          const exportToCSV = () => {
            const { includeSurcharge, includeExpense, includeTotalIncome, includeNetIncome, includeDailySurchargeAsSeparateEntry } = exportOptions;

            // 1. 定義標頭
            let headers = ['日期', '類型', '客戶名稱', '料名', '包數', '重量(噸)', '下貨位數', '備註'];
            
            if (includeSurcharge) {
                headers = [...headers, '基本運費', '位數加價', '總收入(單筆)'];
            } else {
                headers = [...headers, '基本運費']; 
            }
            
            if (includeExpense) {
                headers = [...headers, '支出金額'];
            }
            
            headers = [...headers, '淨值(單筆)'];

            const rows = [headers];
            
            const sortedKeys = Object.keys(data).sort();
            let periodIncome = 0;
            let periodExpense = 0;
            
            // 2. 處理明細資料
            sortedKeys.forEach(dateKey => {
              if (dateKey >= startDate && dateKey <= endDate && data[dateKey].entries?.length > 0) {
                  
                  const dayMetrics = calculateDayMetrics(dateKey, data, settings);
                  
                  let isSurchargeAddedToFirstDelivery = false; 

                  data[dateKey].entries.forEach((entry, index) => {
                     const netValue = calculateEntryNetValue(entry, settings); 
                     const row = [dateKey, entry.type === 'delivery' ? '送貨' : '油錢', entry.clientName || '', entry.material || '', formatForCsv(entry.packages) || '', formatForCsv(entry.weight) || '', formatForCsv(entry.dropLocations) || '', entry.remark || ''];

                     if (entry.type === 'delivery') {
                         const details = calculateDeliveryDetails(entry, settings);
                         let totalIncomeForEntry = details.totalIncome; 
                         
                         if (!includeDailySurchargeAsSeparateEntry && !isSurchargeAddedToFirstDelivery) {
                             totalIncomeForEntry += dayMetrics.surchargeCost;
                             isSurchargeAddedToFirstDelivery = true;
                         }

                         if (includeSurcharge) {
                             row.push(formatForCsv(details.weightCost)); // 基本運費
                             // 只有在合併模式下，才在第一筆顯示總加價金額
                             row.push(formatForCsv(!includeDailySurchargeAsSeparateEntry && index === 0 && dayMetrics.surchargeCost > 0 ? dayMetrics.surchargeCost : '')); // 位數加價
                             row.push(formatForCsv(totalIncomeForEntry)); // 總收入 (單筆 - 含或不含總加價)
                         } else {
                             row.push(formatForCsv(totalIncomeForEntry)); // 基本運費 (單一欄位 - 含或不含總加價)
                         }
                         
                         row.push(includeExpense ? '' : null); // 支出金額 (Delivery 沒有)
                         
                         periodIncome += totalIncomeForEntry; // 累加實際收入
                         row.push(formatForCsv(totalIncomeForEntry)); // 淨值 (單筆收入)

                     } else if (entry.type === 'fuel') {
                         const amount = Math.abs(netValue);
                         
                         if (includeSurcharge) {
                             row.push('', '', ''); // 收入相關欄位空著
                         } else {
                             row.push(''); // 收入相關欄位空著 (單一欄位)
                         }
                         
                         row.push(includeExpense ? formatForCsv(amount) : null); // 支出金額
                         periodExpense += amount;
                         row.push(formatForCsv(netValue)); // 淨值 (負支出)
                     }
                     
                     // 過濾掉因為選項被設為 false 而產生的 null
                     const finalRow = row.filter(val => val !== null);
                     rows.push(finalRow);
                  });
                  
                  // 如果選擇單獨列出總加價，則在當日交易結束後新增一筆
                  if (includeDailySurchargeAsSeparateEntry && dayMetrics.surchargeCost > 0) {
                      const surchargeAmount = formatForCsv(dayMetrics.surchargeCost);
                      const zero = formatForCsv(0);

                      // 基礎欄位: 日期, 類型, 客戶名稱, 料名, 包數, 重量(噸), 下貨位數, 備註 (8 欄)
                      let surchargeRow = [
                          dateKey, 
                          '總位數加價', 
                          'N/A', 
                          '', 
                          '', 
                          '', 
                          formatForCsv(dayMetrics.dailyDrops), 
                          `超 ${settings.dropThreshold} 位加價`
                      ];
                      
                      if (includeSurcharge) {
                          // [8] 基本運費 -> 0
                          surchargeRow.push(zero); 
                          // [9] 位數加價 -> 300
                          surchargeRow.push(surchargeAmount); 
                          // [10] 總收入(單筆)
                          surchargeRow.push(surchargeAmount); 
                      } else {
                          // [8] 基本運費 (作為收入)
                          surchargeRow.push(surchargeAmount); 
                      }
                      
                      // 調整支出欄位
                      if (includeExpense) {
                           // [11] 支出金額 (為空)
                           surchargeRow.push(''); 
                      }
                      
                      // [12] 淨值
                      surchargeRow.push(surchargeAmount); 
                      
                      rows.push(surchargeRow);
                      periodIncome += dayMetrics.surchargeCost;
                  }
              }
            });
            
            // 3. 處理總結資料
            if (includeTotalIncome || includeNetIncome) {
                rows.push([]); // 空行分隔
                rows.push(['--- 期間總結 ---']);
                
                if (includeTotalIncome) {
                    // 總結金額移除逗號
                    rows.push(['總收入 (送貨費)', formatForCsv(periodIncome)]);
                    rows.push(['總支出 (油錢費)', formatForCsv(periodExpense)]);
                }
                
                if (includeNetIncome) {
                    // 總結金額移除逗號
                    rows.push(['淨收入', formatForCsv(periodIncome - periodExpense)]);
                }
            }


            const csvContent = "\uFEFF" + rows.map(e => e.join(",")).join("\n");
            const url = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
            const link = document.createElement("a"); link.href = url; link.download = `貨車記帳報表_${startDate}_${endDate}.csv`; document.body.appendChild(link); link.click(); document.body.removeChild(link); onClose();
          };
          
          const CheckboxItem = ({ label, checked, onChange, helpText }) => (
             <label className="flex items-start cursor-pointer p-2 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
                <input type="checkbox" checked={checked} onChange={onChange} className="mt-1 mr-3 w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500" />
                <div className="flex flex-col">
                    <span className="text-sm font-medium text-gray-700">{label}</span>
                    <span className="text-xs text-gray-400">{helpText}</span>
                </div>
             </label>
          );


          return (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-6">
              <div className="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center gap-2 mb-4 text-gray-800"><Icon name="Download" className="w-5 h-5 text-green-600" /><h3 className="font-bold text-lg">匯出報表</h3></div>
                
                <div className="space-y-4 mb-6 p-4 border rounded-xl bg-gray-50">
                   <h4 className="text-sm font-bold text-gray-700 mb-2">選擇期間</h4>
                   
                   {/* 調整為上下堆疊 */}
                   <div className="flex flex-col space-y-3">
                     <div>
                        <label className="block text-xs text-gray-500 mb-1">開始日期</label>
                        <input type="date" className="w-full p-2 text-sm bg-white rounded-lg border focus:ring-green-500 outline-none" value={startDate} onChange={(e) => setStartDate(e.target.value)}/>
                     </div>
                     <div>
                        <label className="block text-xs text-gray-500 mb-1">結束日期</label>
                        <input type="date" className="w-full p-2 text-sm bg-white rounded-lg border focus:ring-green-500 outline-none" value={endDate} onChange={(e) => setEndDate(e.target.value)}/>
                     </div>
                   </div>
                </div>
                
                <div className="space-y-3 mb-6 p-4 border rounded-xl">
                   <h4 className="text-sm font-bold text-gray-700 mb-3">報表內容選項</h4>
                   <CheckboxItem label="輸出位數加價細節" checked={exportOptions.includeSurcharge} onChange={() => handleOptionChange('includeSurcharge')} helpText="細分基本運費和位數加價欄位。" />
                   <CheckboxItem label="將總加價單獨列出" checked={exportOptions.includeDailySurchargeAsSeparateEntry} onChange={() => handleOptionChange('includeDailySurchargeAsSeparateEntry')} helpText="每日總加價會獨立成為一筆紀錄，否則會加到當天第一筆送貨收入中。" />
                   <CheckboxItem label="輸出支出金額" checked={exportOptions.includeExpense} onChange={() => handleOptionChange('includeExpense')} helpText="輸出油錢等支出紀錄。" />
                   <CheckboxItem label="期間總收入/總支出" checked={exportOptions.includeTotalIncome} onChange={() => handleOptionChange('includeTotalIncome')} helpText="在報表末尾彙總期間的總收入與總支出。" />
                   <CheckboxItem label="期間淨收入" checked={exportOptions.includeNetIncome} onChange={() => handleOptionChange('includeNetIncome')} helpText="在報表末尾彙總期間的淨收入 (總收入-總支出)。" />
                </div>


                <div className="flex gap-3"><button onClick={onClose} className="flex-1 py-3 rounded-lg text-gray-500 hover:bg-gray-100 font-bold">取消</button><button onClick={exportToCSV} className="flex-1 py-3 rounded-lg bg-green-600 text-white font-bold shadow-lg shadow-green-200">下載 CSV</button></div>
              </div>
            </div>
          );
        }


        // 渲染應用程式
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    </script>
</body>
</html>
