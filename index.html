<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貨車記帳助手</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React/ReactDOM/Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: "Inter", sans-serif; }
        #root { 
            max-width: 480px; 
            margin: 0 auto; 
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            min-height: 100vh;
        }
        .loader-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        input[type="date"] { min-height: 44px; }
        .calendar-day-content {
            padding-top: 0.5rem;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        /* 自動完成建議列表樣式 */
        .suggestions-list {
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        /* Toast 通知樣式 */
        .toast {
            animation: toastSlideIn 0.3s ease-out;
        }
        @keyframes toastSlideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .toast-fade-out {
            animation: toastFadeOut 0.3s ease-out forwards;
        }
        @keyframes toastFadeOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Icons ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                ChevronLeft: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
                ChevronRight: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
                Plus: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>,
                Minus: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/></svg>,
                Sliders: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>,
                Truck: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 18H3c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v10h4c1.1 0 2 .9 2 2v1c0 1.1-.9 2-2 2h-1c-.5 0-1-.2-1.4-.6L17 19h-1.4c-.4.4-1.2.6-1.6.6H5c-.5 0-1-.2-1.4-.6L2.6 19H3c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h2zm11 2a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM7 20a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>,
                Package: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.16"/><path d="m7.5 19.73 9-5.16"/><path d="M3.29 7.33l7.98-4.58a1 1 0 0 1 1.44 0l7.98 4.58a1 1 0 0 1 .5 1.05v7.24a1 1 0 0 1-.5 1.05l-7.98 4.58a1 1 0 0 1-1.44 0l-7.98-4.58a1 1 0 0 1-.5-1.05V8.38a1 1 0 0 1 .5-1.05z"/><path d="M12 22v-8"/><path d="M12 10V2"/></svg>,
                MapPin: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>,
                Trash2: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
                Save: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
                LogOut: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
                Search: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
                Download: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
                DollarSign: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
                RefreshCw: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 8"/></svg>,
                CheckCircle: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>,
                AlertCircle: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
                Loader2: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.5 2v3h-3"/><path d="M21.5 10a9.5 9.5 0 1 1-8.5-8.5"/></svg>,
                Fuel: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2v20h18v-2.12c0-1.2-1-2.08-2.22-2.32L14 17V8a2 2 0 0 0-2-2h-3a2 2 0 0 0-2 2v7.72L5.22 19.88C4.01 20.12 3 21.05 3 22V2h18"/></svg>,
                Receipt: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2h-2m-2 4h-4m4 4h-4m4 4h-4m-4 0h-4m-4-4h-4m0-4h-4m0-4h-4"/></svg>,
                ScrollText: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12s-1-5-6-5-6 5-6 5m0 0 1-4m-1 4-1 4m8-4h-6m4 4h-6m4 4h-6M12 22h10"/></svg>,
                Scale: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16.5 3.5 3.5m-15-7 3.5 3.5m5-10v16M21 16.5c-3.5-3.5-8-3-8 0v4H8c-3.5 0-4.5-3-8 0M12 12V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v9M7 12V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v9"/></svg>,
                HelpCircle: (props) => <svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
            };
            const SVGComponent = icons[name];
            if (!SVGComponent) return null;
            return <SVGComponent width={size} height={size} className={className} />;
        };

        // --- 設定與輔助 ---
        const STORAGE_URL_KEY = 'truck_bookkeeping_url';
        const STORAGE_CACHE_KEY = 'truck_bookkeeping_cache';
        const STORAGE_DEVICE_ID_KEY = 'truck_bookkeeping_device_id';
        const initialData = {};
        const initialSettings = { 
          pricePerTon: 500, dropThreshold: 1, dropSurcharge: 200, 
          displayMetrics: { showDailyIncome: true, showDailyNetIncome: true, showDailyWeight: false }
        };

        // --- 操作日誌核心模組（重構：完全避免數據覆蓋）---
        // 取得或生成裝置 ID
        const getDeviceId = () => {
            let deviceId = localStorage.getItem(STORAGE_DEVICE_ID_KEY);
            if (!deviceId) {
                deviceId = `device-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                localStorage.setItem(STORAGE_DEVICE_ID_KEY, deviceId);
            }
            return deviceId;
        };

        // 生成操作 ID
        const generateOperationId = () => {
            return `op-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        };

        // 創建操作記錄
        const createOperation = (type, target, data, dateKey = null, entryId = null) => {
            return {
                id: generateOperationId(),
                timestamp: Date.now(),
                type: type, // 'create' | 'update' | 'delete'
                target: target, // 'entry' | 'settings'
                dateKey: dateKey,
                entryId: entryId,
                data: data,
                deviceId: getDeviceId()
            };
        };

        // 應用單個操作到數據
        const applyOperation = (currentData, operation) => {
            const result = JSON.parse(JSON.stringify(currentData)); // 深拷貝
            
            if (operation.target === 'entry') {
                const dateKey = operation.dateKey;
                
                if (!result.data[dateKey]) {
                    result.data[dateKey] = { entries: [] };
                }
                
                if (operation.type === 'create') {
                    // 檢查是否已存在相同 ID 的 entry（防止重複）
                    const existingIndex = result.data[dateKey].entries
                        .findIndex(e => e.id === operation.entryId);
                    if (existingIndex >= 0) {
                        // 如果已存在，更新而不是添加（防止重複）
                        console.warn(`⚠️ 發現重複的 entry ID: ${operation.entryId}，將更新而非添加`);
                        result.data[dateKey].entries[existingIndex] = {
                            ...result.data[dateKey].entries[existingIndex],
                            ...operation.data,
                            id: operation.entryId
                        };
                    } else {
                        result.data[dateKey].entries.push({
                            ...operation.data,
                            id: operation.entryId
                        });
                    }
                } else if (operation.type === 'update') {
                    const entryIndex = result.data[dateKey].entries
                        .findIndex(e => e.id === operation.entryId);
                    if (entryIndex >= 0) {
                        result.data[dateKey].entries[entryIndex] = {
                            ...result.data[dateKey].entries[entryIndex],
                            ...operation.data
                        };
                    }
                } else if (operation.type === 'delete') {
                    result.data[dateKey].entries = result.data[dateKey].entries
                        .filter(e => e.id !== operation.entryId);
                }
            } else if (operation.target === 'settings') {
                result.settings = {
                    ...result.settings,
                    ...operation.data
                };
            }
            
            return result;
        };

        // 應用多個操作（按時間順序）
        // 優化：假設操作已按時間排序（Google Script 保證順序），移除排序以提升性能
        const applyOperations = (snapshot, operations) => {
            let result = JSON.parse(JSON.stringify(snapshot));
            
            // Google Script append 時順序已固定，不需要排序
            // 可選：在開發模式下驗證順序（僅用於除錯）
            if (operations.length > 1) {
                const isSorted = operations.every((op, i) => 
                    i === 0 || operations[i-1].timestamp <= op.timestamp
                );
                if (!isSorted) {
                    console.warn('操作順序異常，重新排序（這不應該發生）');
                    operations = [...operations].sort((a, b) => a.timestamp - b.timestamp);
                }
            }
            
            operations.forEach(op => {
                result = applyOperation(result, op);
            });
            
            return result;
        };

        const getDateKey = (date) => {
          if (!date) return '';
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const day = String(date.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        };

        // 兼容性輔助：取得料品列表 (兼容舊的 material/packages 單一欄位與新的 items 陣列)
        // 修正：增加 entry 為空的檢查
        const getEntryItems = (entry) => {
            if (!entry) return []; // 防呆檢查
            if (entry.items && Array.isArray(entry.items)) {
                return entry.items;
            }
            if (entry.material) {
                // 舊格式轉新格式
                return [{ material: entry.material, packages: entry.packages }];
            }
            return [];
        };

        // 格式化料名與包數顯示
        const formatItemsDisplay = (items) => {
            if (!items || items.length === 0) return '';
            return items.map(i => `${i.material} (${i.packages || 0}包)`).join(', ');
        };

        // 計算單個 entry 的詳細信息（單筆記錄只顯示基本運費，不加價）
        const calculateDeliveryDetails = (entry, settings, allEntries = []) => {
            const weight = parseFloat(entry.weight) || 0;
            const drops = parseInt(entry.dropLocations) || 0;
            const weightCost = Math.round(weight * settings.pricePerTon);
            
            // 單筆記錄不計算加價，只返回基本運費
            // 加價只在每日總計中按趟數加總計算
            return { weightCost, extraDrops: 0, surchargeCost: 0, totalIncome: weightCost };
        };
        
        const calculateEntryNetValue = (entry, settings, allEntries = []) => {
            if (entry.type === 'fuel') return -(parseFloat(entry.amount) || 0);
            if (entry.type === 'delivery') {
                const details = calculateDeliveryDetails(entry, settings, allEntries);
                return details.totalIncome;
            }
            return 0;
        };

        const calculateDayMetrics = (dateKey, data, settings) => {
            const entries = data[dateKey]?.entries || [];
            let totalBasicIncome = 0; let totalExpense = 0;
            let totalWeight = 0; let totalDrops = 0; 
            let surchargeCost = 0;

            // 按趟數分組，將同趟數的位數加總後計算加價
            const trips = {}; // { tripNumber: totalDrops }

            entries.forEach(entry => {
                if (entry.type === 'delivery') {
                    const weight = parseFloat(entry.weight) || 0;
                    const drops = parseInt(entry.dropLocations) || 0;
                    const tripNumber = parseInt(entry.tripNumber) || 1;
                    
                    totalBasicIncome += (weight * settings.pricePerTon);
                    totalWeight += weight;
                    totalDrops += drops; 
                    
                    // 按趟數累加位數
                    if (!trips[tripNumber]) {
                        trips[tripNumber] = 0;
                    }
                    trips[tripNumber] += drops;
                } else if (entry.type === 'fuel') {
                    totalExpense += (parseFloat(entry.amount) || 0);
                }
            });
            
            // 對每個趟數，將位數加總後計算加價
            Object.keys(trips).forEach(tripNumber => {
                const tripTotalDrops = trips[tripNumber];
                const extraDrops = Math.max(0, tripTotalDrops - settings.dropThreshold);
                const tripSurcharge = extraDrops * settings.dropSurcharge;
                surchargeCost += tripSurcharge;
            });
            
            const totalIncome = Math.round(totalBasicIncome + surchargeCost);
            const totalNetIncome = totalIncome - totalExpense;

            return { dailyIncome: totalIncome, dailyNetIncome: totalNetIncome, dailyWeight: totalWeight, dailyDrops: totalDrops, surchargeCost: surchargeCost, hasData: entries.length > 0 };
        };

        const CheckboxItem = ({ label, checked, onChange, helpText, disabled = false }) => (
            <label className={`flex items-start p-2 bg-gray-50 rounded-lg transition-colors ${disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:bg-gray-100'}`}>
                <input type="checkbox" checked={checked} onChange={onChange} disabled={disabled} className="mt-1 mr-3 w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 disabled:cursor-not-allowed" />
                <div className="flex flex-col"><span className="text-sm font-medium text-gray-700">{label}</span><span className="text-xs text-gray-400">{helpText}</span></div>
            </label>
        );
        
        function DailyMetric({ value, label, unit, isPositive, color, precision = 0 }) {
            if (value === 0 && label === '噸數') value = 0; else if (value === 0) return null; 
            let valueText;
            if (precision > 0) valueText = parseFloat(value).toFixed(precision).replace(/,/g, '');
            else valueText = Math.abs(value).toLocaleString('en-US').replace(/,/g, ''); 
            const colorMap = { green: isPositive ? 'text-green-600' : 'text-gray-500', blue: isPositive ? 'text-blue-600' : 'text-red-600', orange: 'text-orange-600' };
            const valueClass = colorMap[color] || 'text-gray-600';
            return (<div className="flex flex-col items-center leading-tight"><span className={`block text-[11px] font-bold ${valueClass}`}>{label !== '噸數' && (isPositive ? '' : '-')}{valueText}<span className="text-[9px] ml-0.5 font-normal text-gray-500">{unit}</span></span></div>);
        }

        // --- 自動完成輸入框 (AutocompleteInput) ---
        const AutocompleteInput = ({ label, value, onChange, options, placeholder, name, type = "text", autoFocus = false, required = false }) => {
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [filteredOptions, setFilteredOptions] = useState([]);
            const wrapperRef = useRef(null);

            useEffect(() => {
                if (value && showSuggestions) {
                    const matches = options.filter(opt => opt && opt.toLowerCase().includes(value.toLowerCase()) && opt !== value);
                    setFilteredOptions(matches);
                } else {
                    setFilteredOptions([]);
                }
            }, [value, options, showSuggestions]);

            // 點擊外部關閉建議
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                        setShowSuggestions(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [wrapperRef]);

            const handleSelect = (option) => {
                onChange({ target: { name, value: option } }); // 模擬 input event
                setShowSuggestions(false);
            };

            return (
                <div className="relative" ref={wrapperRef}>
                    {label && <label className="block text-xs text-gray-500 mb-1">{label}</label>}
                    <input
                        type={type}
                        name={name}
                        value={value}
                        onChange={(e) => { onChange(e); setShowSuggestions(true); }}
                        onFocus={() => setShowSuggestions(true)}
                        placeholder={placeholder}
                        required={required}
                        autoFocus={autoFocus}
                        className="w-full p-3 bg-gray-50 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none"
                        autoComplete="off"
                    />
                    {showSuggestions && filteredOptions.length > 0 && (
                        <ul className="absolute z-50 w-full bg-white border border-gray-200 rounded-lg mt-1 suggestions-list">
                            {filteredOptions.map((opt, idx) => (
                                <li 
                                    key={idx} 
                                    onMouseDown={() => handleSelect(opt)}
                                    className="p-3 hover:bg-blue-50 cursor-pointer text-sm text-gray-700 border-b border-gray-50 last:border-0"
                                >
                                    {opt}
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        };

        // --- 主應用程式 ---
        const App = () => {
          const [view, setView] = useState('loading');
          const [currentDate, setCurrentDate] = useState(new Date());
          const [googleUrl, setGoogleUrl] = useState('');
          const [data, setData] = useState(initialData);
          const [settings, setSettings] = useState(initialSettings);
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [isSearchOpen, setIsSearchOpen] = useState(false);
          const [isDownloadOpen, setIsDownloadOpen] = useState(false);
          const [syncStatus, setSyncStatus] = useState('idle');
          const [loginError, setLoginError] = useState('');
          const [showTransactionModal, setShowTransactionModal] = useState(false);
          const [transactionType, setTransactionType] = useState('delivery'); 
          const [editingEntry, setEditingEntry] = useState(null);
          const [showMenuModal, setShowMenuModal] = useState(false);
          const [toast, setToast] = useState(null); // Toast 通知狀態

          // ===== SyncManager 模組：數據同步管理 =====
          const SyncManager = (() => {
              // 讀取快照
              const loadSnapshot = async (url) => {
              try {
                  const response = await fetch(`${url}?action=snapshot`);
                  if (!response.ok) {
                      throw new Error(`讀取快照失敗: ${response.status}`);
                  }
                  const text = await response.text();
                  if (!text || text.trim() === '') {
                      // 返回空快照
                      return {
                          snapshot: { data: {}, settings: initialSettings },
                          lastOperationId: '',
                          lastSyncTime: 0
                      };
                  }
                  try {
                      return JSON.parse(text);
                  } catch(e) {
                      console.error('快照解析失敗:', e);
                      return {
                          snapshot: { data: {}, settings: initialSettings },
                          lastOperationId: '',
                          lastSyncTime: 0
                      };
                  }
              } catch (error) {
                  console.error('讀取快照失敗:', error);
                  // 返回空快照
                  return {
                      snapshot: { data: {}, settings: initialSettings },
                      lastOperationId: '',
                      lastSyncTime: 0
                  };
              }
          };

              // 讀取操作日誌
              const loadOperations = async (url, sinceOperationId = '') => {
              try {
                  const sinceParam = sinceOperationId ? `&since=${encodeURIComponent(sinceOperationId)}` : '';
                  const response = await fetch(`${url}?action=log${sinceParam}`);
                  if (!response.ok) {
                      // 如果不支援操作日誌，返回空陣列（向後兼容）
                      return [];
                  }
                  const text = await response.text();
                  if (!text || text.trim() === '') {
                      return [];
                  }
                  try {
                      return JSON.parse(text);
                  } catch(e) {
                      return [];
                  }
              } catch (error) {
                  // 如果不支援操作日誌，返回空陣列（向後兼容）
                  return [];
              }
          };

              // 載入並合併數據（優化：並行讀取 + 增量讀取）
              const loadAndMergeData = async (url, useIncremental = true, currentData = null, currentSettings = null) => {
              try {
                  // 優化 2: 並行讀取 - 先讀取快照以取得正確的 lastOperationId
                  const snapshotResponse = await fetch(`${url}?action=snapshot`).catch(() => null);
                  
                  let snapshotData;
                  let hasSnapshotSupport = false;
                  
                  if (snapshotResponse && snapshotResponse.ok) {
                      const text = await snapshotResponse.text();
                      if (text && text.trim()) {
                          try {
                              const parsed = JSON.parse(text);
                              // 檢查是否為有效的快照格式（必須有 snapshot 屬性）
                              if (parsed && typeof parsed === 'object' && 'snapshot' in parsed) {
                                  snapshotData = parsed;
                                  hasSnapshotSupport = true;
                              } else {
                                  // 如果不是快照格式，不支援操作日誌
                                  throw new Error('OPERATION_LOG_NOT_SUPPORTED');
                              }
                          } catch(e) {
                              // 如果解析失敗，可能是不支援操作日誌
                              if (e.message === 'OPERATION_LOG_NOT_SUPPORTED') {
                                  throw e;
                              }
                              snapshotData = {
                                  snapshot: { data: {}, settings: initialSettings },
                                  lastOperationId: '',
                                  lastSyncTime: 0
                              };
                          }
                      } else {
                          // 空響應，可能是不支援操作日誌
                          throw new Error('OPERATION_LOG_NOT_SUPPORTED');
                      }
                  } else {
                      // 無法讀取快照，可能是不支援操作日誌
                      throw new Error('OPERATION_LOG_NOT_SUPPORTED');
                  }
                  
                  // 改進：使用 timestamp 而不是 operation_id 來過濾操作（更可靠）
                  // 獲取快照的最後時間戳
                  const snapshotLastTimestamp = snapshotData.lastSyncTime || 0;
                  
                  // 優化 1: 增量讀取 - 使用快照的 lastSyncTime 或 localStorage 的（取較新者）
                  let lastTimestamp = 0;
                  if (useIncremental) {
                      const localLastTimestamp = parseInt(localStorage.getItem('last_timestamp') || '0');
                      // 使用較新的時間戳
                      lastTimestamp = Math.max(localLastTimestamp, snapshotLastTimestamp);
                  } else {
                      lastTimestamp = snapshotLastTimestamp;
                  }
                  
                  // 讀取操作日誌（只讀取 lastTimestamp 之後的操作）
                  let operations = [];
                  try {
                      // 使用 timestamp 參數（更可靠）
                      console.log('📥 讀取操作日誌，sinceTimestamp:', lastTimestamp);
                      const operationsResponse = await fetch(`${url}?action=log&sinceTimestamp=${lastTimestamp}`).catch(() => null);
                      if (operationsResponse && operationsResponse.ok) {
                          const text = await operationsResponse.text();
                          if (text && text.trim()) {
                              try {
                                  const parsed = JSON.parse(text);
                                  // 檢查是否為陣列（操作日誌應該是陣列）
                                  if (Array.isArray(parsed)) {
                                      operations = parsed;
                                      console.log('📋 讀取到操作數量:', operations.length);
                                  } else {
                                      // 如果不是陣列，可能是不支援操作日誌
                                      console.warn('⚠️ 操作日誌不是陣列:', parsed);
                                      operations = [];
                                  }
                              } catch(e) {
                                  console.error('操作日誌解析失敗:', e);
                                  operations = [];
                              }
                          } else {
                              console.log('操作日誌響應為空');
                          }
                      } else {
                          console.warn('操作日誌請求失敗:', operationsResponse?.status);
                      }
                  } catch (e) {
                      console.error('讀取操作日誌異常:', e);
                      operations = [];
                  }
                  
                  // 調試：檢查快照和操作
                  console.log('🔍 合併前檢查:', {
                      snapshotDataKeys: Object.keys(snapshotData.snapshot?.data || {}),
                      snapshotDataCount: Object.keys(snapshotData.snapshot?.data || {}).length,
                      operationsCount: operations.length,
                      lastTimestamp: lastTimestamp,
                      useIncremental: useIncremental,
                      hasCurrentData: !!currentData && Object.keys(currentData).length > 0
                  });
                  
                  // 優化 3: 合併策略
                  let merged;
                  if (useIncremental && lastTimestamp > 0 && currentData && Object.keys(currentData).length > 0) {
                      // 增量更新：只應用新操作到現有數據
                      console.log('📈 使用增量更新');
                      merged = applyOperations({ data: currentData, settings: currentSettings || initialSettings }, operations);
                  } else {
                      // 完整讀取：從快照開始合併所有操作
                      // 注意：這裡只合併快照之後的操作，不會重複
                      console.log('📚 使用完整讀取（從快照開始）');
                      merged = applyOperations(snapshotData.snapshot, operations);
                  }
                  
                  // 去重：確保每個 dateKey 下的 entries 沒有重複的 ID
                  if (merged.data) {
                      Object.keys(merged.data).forEach(dateKey => {
                          if (merged.data[dateKey] && merged.data[dateKey].entries) {
                              const seen = new Set();
                              const uniqueEntries = [];
                              merged.data[dateKey].entries.forEach(entry => {
                                  if (entry.id && !seen.has(entry.id)) {
                                      seen.add(entry.id);
                                      uniqueEntries.push(entry);
                                  } else if (entry.id && seen.has(entry.id)) {
                                      console.warn(`⚠️ 發現重複的 entry ID: ${entry.id} (dateKey: ${dateKey})，已移除重複項`);
                                  }
                              });
                              merged.data[dateKey].entries = uniqueEntries;
                          }
                      });
                  }
                  
                  // 計算最終操作 ID 和 timestamp（用於追蹤）
                  let finalOperationId = snapshotData.lastOperationId || '';
                  let finalTimestamp = lastTimestamp;
                  
                  if (operations.length > 0) {
                      const lastOp = operations[operations.length - 1];
                      finalOperationId = lastOp.id || finalOperationId;
                      finalTimestamp = Math.max(finalTimestamp, lastOp.timestamp || 0);
                  }
                  
                  // 更新最後操作 ID 和 timestamp（確保不會遺漏）
                  if (finalOperationId) {
                      localStorage.setItem('last_operation_id', finalOperationId);
                  }
                  if (finalTimestamp > 0) {
                      localStorage.setItem('last_timestamp', String(finalTimestamp));
                  }
                  
                  return {
                      data: merged.data,
                      settings: merged.settings,
                      lastOperationId: finalOperationId,
                      lastTimestamp: finalTimestamp
                  };
              } catch (error) {
                  console.error('載入數據失敗:', error);
                  throw error;
              }
          };

              // 保存操作（不覆蓋，只追加）
              const saveOperation = async (url, operation) => {
              try {
                  const encodedOp = encodeURIComponent(JSON.stringify(operation));
                  const saveUrl = `${url}?action=append&operation=${encodedOp}`;
                  
                  const response = await fetch(saveUrl);
                  if (!response.ok) {
                      throw new Error(`保存操作失敗: ${response.status}`);
                  }
                  
                  const text = await response.text();
                  let result;
                  try {
                      result = JSON.parse(text);
                  } catch(e) {
                      // 如果無法解析，可能是不支援操作日誌
                      throw new Error('OPERATION_LOG_NOT_SUPPORTED');
                  }
                  
                  if (result.status === 'error') {
                      throw new Error(result.error || '保存失敗');
                  }
                  
                  return result.success === true;
              } catch (error) {
                  if (error.message === 'OPERATION_LOG_NOT_SUPPORTED') {
                      throw error; // 向上拋出，讓調用者處理
                  }
                  console.error('保存操作失敗:', error);
                  throw error;
              }
          };

              // 合併數據（應用操作）
              const merge = (snapshot, operations) => {
                  return applyOperations(snapshot, operations);
              };

              // 公開 API
              return {
                  loadSnapshot,
                  loadOperations,
                  saveOperation,
                  merge,
                  loadAndMerge: loadAndMergeData
              };
          })();

          // 操作日誌版本的保存函數（優化：樂觀更新）
          const performOperationBasedUpdate = async (operation) => {
              if (!googleUrl) { 
                  alert("未設定同步網址，無法儲存。"); 
                  return false; 
              }
              
              setSyncStatus('syncing');
              
              // 優化：樂觀更新 - 立即更新本地狀態
              let optimisticData = { data, settings };
              try {
                  optimisticData = applyOperation({ data, settings }, operation);
                  setData(optimisticData.data);
                  setSettings({
                      ...initialSettings,
                      ...optimisticData.settings,
                      displayMetrics: {
                          ...initialSettings.displayMetrics,
                          ...optimisticData.settings.displayMetrics
                      }
                  });
              } catch (e) {
                  console.error('樂觀更新失敗:', e);
              }
              
              try {
                  // 保存到雲端（背景操作）
                  const success = await SyncManager.saveOperation(googleUrl, operation);
                  
                  if (success) {
                      // 更新最後操作 ID 和 timestamp
                      if (operation.id) {
                          localStorage.setItem('last_operation_id', operation.id);
                      }
                      if (operation.timestamp) {
                          localStorage.setItem('last_timestamp', String(operation.timestamp));
                      }
                      
                      // 更新本地快取
                      localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify({
                          data: optimisticData.data,
                          settings: optimisticData.settings,
                          lastOperationId: operation.id,
                          lastTimestamp: operation.timestamp
                      }));
                      
                      setSyncStatus('success');
                      setTimeout(() => setSyncStatus('idle'), 2000);
                      return true;
                  } else {
                      // 如果保存失敗，回滾並重新讀取
                      const merged = await SyncManager.loadAndMerge(googleUrl, false); // 完整讀取
                      setData(merged.data);
                      setSettings({
                          ...initialSettings,
                          ...merged.settings,
                          displayMetrics: {
                              ...initialSettings.displayMetrics,
                              ...merged.settings.displayMetrics
                          }
                      });
                      return false;
                  }
              } catch (error) {
                  // 如果保存失敗，回滾並重新讀取
                  try {
                      const merged = await SyncManager.loadAndMerge(googleUrl, false, null, null); // 完整讀取
                      setData(merged.data);
                      setSettings({
                          ...initialSettings,
                          ...merged.settings,
                          displayMetrics: {
                              ...initialSettings.displayMetrics,
                              ...merged.settings.displayMetrics
                          }
                      });
                  } catch (rollbackError) {
                      console.error('回滾失敗:', rollbackError);
                  }
                  
                  console.error('操作保存失敗:', error);
                  setSyncStatus('error');
                  throw error; // 重新拋出錯誤，讓調用者處理
              }
          };


          // 手動觸發快照更新
          const triggerSnapshotUpdate = async (url) => {
              try {
                  console.log('開始更新快照...', url);
                  const response = await fetch(`${url}?action=updateSnapshot`);
                  console.log('快照更新響應狀態:', response.status, response.statusText);
                  
                  if (!response.ok) {
                      const errorText = await response.text();
                      console.error('❌ 快照更新失敗 - HTTP 錯誤:', response.status, errorText);
                      try {
                          const errorResult = JSON.parse(errorText);
                          if (errorResult.error) {
                              console.error('錯誤詳情:', errorResult.error);
                              if (errorResult.stack) {
                                  console.error('錯誤堆疊:', errorResult.stack);
                              }
                          }
                      } catch (e) {
                          // 無法解析錯誤響應
                      }
                      return false;
                  }
                  
                  const text = await response.text();
                  console.log('快照更新響應內容:', text);
                  
                  try {
                      const result = JSON.parse(text);
                      if (result.success === true) {
                          console.log('✅ 快照更新成功:', result.message || '');
                          if (result.snapshotRows !== undefined) {
                              console.log('快照記錄數:', result.snapshotRows);
                          }
                          if (result.isEmpty) {
                              console.log('ℹ️ 快照為空（沒有數據）');
                          }
                          return true;
                      } else {
                          // 詳細顯示失敗原因
                          console.error('❌ 快照更新失敗 - 響應表示失敗');
                          const errorMsg = result.message || result.error || '未知錯誤';
                          console.error('失敗原因:', errorMsg);
                          
                          if (result.warning) {
                              console.warn('警告:', result.warning);
                          }
                          if (result.error) {
                              console.error('錯誤詳情:', result.error);
                          }
                          if (result.stack) {
                              console.error('錯誤堆疊:', result.stack);
                          }
                          
                          // 顯示完整的響應以便調試
                          console.error('完整響應:', JSON.stringify(result, null, 2));
                          
                          return false;
                      }
                  } catch (parseError) {
                      console.error('❌ 快照更新響應解析失敗:', parseError);
                      console.error('響應內容:', text);
                      return false;
                  }
              } catch (error) {
                  console.error('❌ 觸發快照更新失敗:', error);
                  console.error('錯誤堆疊:', error.stack);
                  return false;
              }
          };

          const fetchFromGoogle = async (url, isAutoLogin = false, forceUpdateSnapshot = false) => {
            if (!url) return;
            setSyncStatus('syncing'); 
            setLoginError('');
            
            // 每次開啟時自動更新快照（確保數據最新）
            // 手動同步或自動登入時都會更新快照
            if (forceUpdateSnapshot || isAutoLogin) {
                await triggerSnapshotUpdate(url);
            }
            
            try {
              // 優先使用操作日誌方式讀取（優化：並行讀取 + 增量讀取）
              try {
                  // 首次載入使用完整讀取，後續使用增量讀取
                  const isFirstLoad = !localStorage.getItem('last_operation_id') && !localStorage.getItem('last_timestamp');
                  // 如果是首次載入或當前數據為空，使用完整讀取（不傳入當前數據）
                  // 只有在有現有數據時才使用增量讀取
                  const hasExistingData = data && Object.keys(data).length > 0;
                  const shouldUseIncremental = !isFirstLoad && hasExistingData;
                  // 傳入當前數據以支援增量讀取（只有在有數據時才傳入）
                  const merged = await SyncManager.loadAndMerge(url, shouldUseIncremental, shouldUseIncremental ? data : null, shouldUseIncremental ? settings : null);
                  
                  const mergedSettings = {
                      ...initialSettings,
                      ...merged.settings,
                      displayMetrics: {
                          ...initialSettings.displayMetrics,
                          ...merged.settings.displayMetrics
                      }
                  };
                  
                  // 調試：檢查合併後的數據
                  const dataKeys = Object.keys(merged.data || {});
                  console.log('📊 合併後的數據:', {
                      dataKeys: dataKeys,
                      dataCount: dataKeys.length,
                      settings: mergedSettings,
                      lastOperationId: merged.lastOperationId,
                      lastTimestamp: merged.lastTimestamp
                  });
                  
                  // 檢查日期鍵格式並修正
                  if (merged.data && dataKeys.length > 0) {
                      const normalizedData = {};
                      let hasInvalidFormat = false;
                      
                      dataKeys.forEach(key => {
                          // 檢查日期鍵格式是否正確（應該是 YYYY-MM-DD）
                          if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) {
                              hasInvalidFormat = true;
                              console.warn('⚠️ 發現無效的日期鍵格式:', key);
                              
                              // 嘗試解析並轉換為正確格式
                              try {
                                  const dateObj = new Date(key);
                                  if (!isNaN(dateObj.getTime())) {
                                      const normalizedKey = getDateKey(dateObj);
                                      console.log('✅ 日期鍵已正規化:', key, '->', normalizedKey);
                                      normalizedData[normalizedKey] = merged.data[key];
                                  } else {
                                      console.error('❌ 無法解析日期鍵:', key);
                                      normalizedData[key] = merged.data[key]; // 保留原鍵
                                  }
                              } catch (e) {
                                  console.error('❌ 日期鍵轉換失敗:', key, e);
                                  normalizedData[key] = merged.data[key]; // 保留原鍵
                              }
                          } else {
                              normalizedData[key] = merged.data[key];
                          }
                      });
                      
                      if (hasInvalidFormat) {
                          console.log('🔧 修正後的數據鍵:', Object.keys(normalizedData));
                          merged.data = normalizedData;
                      }
                  }
                  
                  // 檢查數據是否為空
                  if (!merged.data || Object.keys(merged.data).length === 0) {
                      console.warn('⚠️ 警告：合併後的數據為空');
                      console.log('合併後的數據結構:', {
                          dataKeys: Object.keys(merged.data || {}),
                          settings: mergedSettings,
                          lastOperationId: merged.lastOperationId,
                          lastTimestamp: merged.lastTimestamp
                      });
                  }
                  
                  setData(merged.data);
                  setSettings(mergedSettings);
                  localStorage.setItem(STORAGE_URL_KEY, url);
                  localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify({
                      data: merged.data,
                      settings: mergedSettings,
                      lastOperationId: merged.lastOperationId,
                      lastTimestamp: merged.lastTimestamp || 0
                  }));
                  
                  setSyncStatus('success');
                  setView('calendar');
                  setTimeout(() => setSyncStatus('idle'), 2000);
              } catch (opLogError) {
                  // 操作日誌方式失敗，直接拋出錯誤
                  console.error('操作日誌讀取失敗:', opLogError);
                  throw opLogError;
              }
            } catch (error) {
              setSyncStatus('error'); 
              if (!isAutoLogin) setLoginError(`連線失敗: ${error.message}`);
              if (isAutoLogin && view === 'loading') setView('calendar');
            }
          };

          useEffect(() => {
            const savedUrl = localStorage.getItem(STORAGE_URL_KEY); 
            const savedCache = localStorage.getItem(STORAGE_CACHE_KEY);
            
            // 先載入緩存數據（如果有）
            if (savedCache) { 
                try { 
                    const parsed = JSON.parse(savedCache); 
                    if (parsed.data) {
                        setData(parsed.data);
                        console.log('已載入緩存數據，記錄數:', Object.keys(parsed.data).length);
                    }
                    if (parsed.settings) { 
                        setSettings({ 
                            ...initialSettings, 
                            ...parsed.settings, 
                            displayMetrics: { 
                                ...initialSettings.displayMetrics, 
                                ...parsed.settings.displayMetrics 
                            } 
                        }); 
                    } 
                } catch (e) {
                    console.error('載入緩存失敗:', e);
                } 
            }
            
            // 然後嘗試從 Google 同步
            if (savedUrl) { 
                setGoogleUrl(savedUrl); 
                fetchFromGoogle(savedUrl, true); 
            } else { 
                setView('login'); 
            }
          }, []);

          const handleSaveTransaction = async (entry) => {
            const dateKey = getDateKey(currentDate);
            
            // 立即關閉模態框（樂觀更新，避免用戶重複點擊）
            setShowTransactionModal(false);
            const savedEditingEntry = editingEntry; // 保存當前編輯狀態
            const savedTransactionType = transactionType;
            setEditingEntry(null);
            setTransactionType('delivery');
            
            try {
                if (savedEditingEntry) {
                    // 更新操作
                    const operation = createOperation(
                        'update',
                        'entry',
                        { ...entry, type: savedTransactionType },
                        dateKey,
                        savedEditingEntry.id
                    );
                    
                    const success = await performOperationBasedUpdate(operation);
                    if (success) {
                        showToast('記錄已成功更新', 'success');
                    } else {
                        // 如果保存失敗，重新打開模態框
                        setEditingEntry(savedEditingEntry);
                        setTransactionType(savedTransactionType);
                        setShowTransactionModal(true);
                        showToast('儲存失敗，請重試', 'error');
                    }
                } else {
                    // 創建操作
                    const entryId = `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                    const operation = createOperation(
                        'create',
                        'entry',
                        { ...entry, type: savedTransactionType, id: entryId },
                        dateKey,
                        entryId
                    );
                    
                    const success = await performOperationBasedUpdate(operation);
                    if (success) {
                        showToast('記錄已成功新增', 'success');
                    } else {
                        // 如果保存失敗，重新打開模態框
                        setTransactionType(savedTransactionType);
                        setShowTransactionModal(true);
                        showToast('儲存失敗，請重試', 'error');
                    }
                }
            } catch (error) {
                // 操作日誌保存失敗
                console.error('操作日誌保存失敗:', error);
                // 重新打開模態框
                if (savedEditingEntry) {
                    setEditingEntry(savedEditingEntry);
                }
                setTransactionType(savedTransactionType);
                setShowTransactionModal(true);
                showToast(`儲存失敗：${error.message}`, 'error');
            }
          };
          
          const handleDeleteTransaction = async (id) => {
             if(window.confirm('確定刪除此筆紀錄？')) {
                const dateKey = getDateKey(currentDate);
                
                // 立即關閉模態框（樂觀更新，避免用戶重複點擊）
                setShowTransactionModal(false);
                const savedEditingEntry = editingEntry; // 保存當前編輯狀態
                const savedTransactionType = transactionType;
                setEditingEntry(null);
                setTransactionType('delivery');
                
                try {
                    // 刪除操作

                dataKeysCount: Object.keys(data).length
            });

                    // 支持兩種日期格式：YYYYMMDD 或 YYYY-MM-DD
                    let yearStr, monthStr, dayStr;
                    if (dateKey.includes('-')) {
                        // YYYY-MM-DD 格式
                        const parts = dateKey.split('-');
                        yearStr = parts[0];
                        monthStr = parts[1];
                        dayStr = parts[2];
                    } else {
                        // YYYYMMDD 格式
                        yearStr = dateKey.substring(0, 4);
                        monthStr = dateKey.substring(4, 6);
                        dayStr = dateKey.substring(6, 8);
                    }
                    
                    const date = new Date(parseInt(yearStr), parseInt(monthStr) - 1, parseInt(dayStr));
                    
                    if (date.getFullYear() === year && date.getMonth() === month) {

                monthlyNetIncome: totalIncome - totalExpense

                monthlyExpense: totalExpense,

(噸)" checked={form.displayMetrics.showDailyWeight} onChange={() => handleMetricChange('showDailyWeight')} helpText="在月曆上顯示當日送貨總重量 (橘色)。" /></div><div className="pt-4 flex gap-3"><button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200">取消</button><button type="submit" onClick={handleSubmit} className="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700">儲存設定</button></div></div></div>);

                        const isMatch = (entry.clientName && entry.clientName.toLowerCase().includes(searchLower)) || (itemsStr.toLowerCase().includes(searchLower)) || (entry.remark && entry.remark.toLowerCase().includes(searchLower));

:</span> ${entry.amount.toLocaleString('en-US').replace(/,/g, '')}</div><div className="text-xs text-gray-500 truncate pt-1 border-t border-gray-100"><span className="text-gray-400 font-medium">備註:</span> {entry.remark || '無'}</div></div>)}</div>); })) : query ? <p className="text-center text-gray-400 mt-10">找不到符合 "{query}" 的紀錄。</p> : <p className="text-center text-gray-400 mt-10">開始輸入以搜尋交易紀錄...</p>}</div></div>);

        // Modals - DownloadModal
        UI.Modals.DownloadModal = function DownloadModal({ data, settings, onClose, calculateDeliveryDetails, calculateDayMetrics }) {
          const today = getDateKey(new Date());
          const [startDate, setStartDate] = useState(today.substring(0, 8) + '01');
          const [endDate, setEndDate] = useState(today);
          const [exportOptions, setExportOptions] = useState({ includeSurcharge: true, includeExpense: true, includeTotalIncome: true, includeNetIncome: true, includeDailySurchargeAsSeparateEntry: true });
          const [isExporting, setIsExporting] = useState(false);

          const handleOptionChange = (key) => { setExportOptions(prev => ({ ...prev, [key]: !prev[key] })); };
          const formatForCsv = (value) => { if (value === null || value === undefined || value === '') return ''; const num = parseFloat(value); if (isNaN(num)) return String(value).replace(/,/g, ''); return num.toString().replace(/,/g, ''); };

          // 優化：異步生成 CSV，避免 UI 凍結
          const exportToCSV = async () => {
            const { includeSurcharge, includeExpense, includeTotalIncome, includeNetIncome, includeDailySurchargeAsSeparateEntry } = exportOptions;
            
            // 顯示載入狀態
            setIsExporting(true);
            setExportProgress(0);
            
            let headers = ['日期', '類型', '客戶名稱', '料名', '包數', '重量(噸)', '下貨位數', '趟數', '備註'];
            if (includeSurcharge) headers = [...headers, '基本運費', '位數加價', '總收入(單筆)']; else headers = [...headers, '基本運費'];
            if (includeExpense) headers = [...headers, '支出金額'];
            headers = [...headers, '淨值(單筆)'];
            const rows = [headers];
            const sortedKeys = Object.keys(data).sort();
            let periodIncome = 0; 
            let periodExpense = 0;
            
            // 計算總記錄數（用於進度條）
            // 注意：如果一個 entry 有多個 items，每個 item 會是一行
            let totalEntries = 0;
            for (const dateKey of sortedKeys) {
              if (dateKey >= startDate && dateKey <= endDate && data[dateKey]?.entries?.length > 0) {
                for (const entry of data[dateKey].entries) {
                  if (entry.type === 'delivery') {
                    const items = getEntryItems(entry);
                    // 每個 item 算一行，如果沒有 items 則算一行
                    totalEntries += Math.max(1, items.length);
                  } else {
                    // 油錢支出算一行
                    totalEntries += 1;
                  }
                }
              }
            }
            
            let processedEntries = 0;
            
            // 異步處理每個日期
            for (const dateKey of sortedKeys) {
              if (dateKey >= startDate && dateKey <= endDate && data[dateKey].entries?.length > 0) {
                  const dayMetrics = calculateDayMetrics(dateKey, data, settings);
                  
                  // 計算每趟的加價（按趟數分組計算）
                  const tripSurcharges = {}; // { tripNumber: surchargeAmount }
                  const dayEntries = data[dateKey].entries || [];
                  const trips = {}; // { tripNumber: totalDrops }
                  
                  // 先計算每趟的總位數
                  dayEntries.forEach(e => {
                      if (e.type === 'delivery') {
                          const tripNumber = parseInt(e.tripNumber) || 1;
                          const drops = parseInt(e.dropLocations) || 0;
                          if (!trips[tripNumber]) {
                              trips[tripNumber] = 0;
                          }
                          trips[tripNumber] += drops;
                      }
                  });
                  
                  // 計算每趟的加價
                  Object.keys(trips).forEach(tripNumber => {
                      const tripTotalDrops = trips[tripNumber];
                      const extraDrops = Math.max(0, tripTotalDrops - settings.dropThreshold);
                      const tripSurcharge = extraDrops * settings.dropSurcharge;
                      tripSurcharges[tripNumber] = tripSurcharge;
                  });
                  
                  // 追蹤每趟的第一筆送貨是否已加加價
                  const tripSurchargeAdded = {}; // { tripNumber: boolean }
                  
                  // 異步處理每個記錄
                  for (let index = 0; index < dayEntries.length; index++) {
                     const entry = dayEntries[index];
                     const netValue = calculateEntryNetValue(entry, settings, dayEntries); 
                     const items = getEntryItems(entry);

                     if (entry.type === 'delivery') {
                         const details = calculateDeliveryDetails(entry, settings, dayEntries);
                         let totalIncomeForEntry = details.totalIncome; 
                         const tripNumber = parseInt(entry.tripNumber) || 1;
                         
                         // 位數加價處理：按趟數分別計算，每趟的加價加到該趟的第一筆送貨
                         const shouldAddSurcharge = !includeDailySurchargeAsSeparateEntry && 
                                                    !tripSurchargeAdded[tripNumber] &&
                                                    tripSurcharges[tripNumber] > 0;
                         
                         if (shouldAddSurcharge) { 
                             totalIncomeForEntry += tripSurcharges[tripNumber]; 
                             tripSurchargeAdded[tripNumber] = true;
                         }
                         
                         // 累加每筆送貨記錄的收入（在處理所有 items 之前累加一次）
                         // 注意：如果 includeDailySurchargeAsSeparateEntry 為 false，加價已經包含在 totalIncomeForEntry 中
                         periodIncome += totalIncomeForEntry;
                         
                         // 如果有多個料名，每個料名生成一行
                         if (items.length > 0) {
                             for (let itemIndex = 0; itemIndex < items.length; itemIndex++) {
                                 const item = items[itemIndex];
                                 const isFirstItem = itemIndex === 0;
                                 const row = [
                                     dateKey, 
                                     '送貨', 
                                     entry.clientName || '', 
                                     item.material || '', 
                                     formatForCsv(item.packages) || '', 
                                     // 重量欄位：只有第一個 item 顯示重量，其他 item 留空
                                     isFirstItem ? (formatForCsv(entry.weight) || '') : '', 
                                     // 下貨位數欄位：只有第一個 item 顯示下貨位數，其他 item 留空
                                     isFirstItem ? (formatForCsv(entry.dropLocations) || '') : '', 
                                     // 趟數欄位：只有第一個 item 顯示趟數，其他 item 留空
                                     isFirstItem ? (formatForCsv(entry.tripNumber) || '1') : '', 
                                     entry.remark || ''
                                 ];
                                 
                                 // 金額欄位：只有第一個 item 顯示金額，其他 item 留空
                                 if (isFirstItem) {
                                     if (includeSurcharge) { 
                                         row.push(formatForCsv(details.weightCost)); 
                                         row.push(formatForCsv(shouldAddSurcharge && tripSurcharges[tripNumber] > 0 ? tripSurcharges[tripNumber] : '')); 
                                         row.push(formatForCsv(totalIncomeForEntry)); 
                                     } else { 
                                         row.push(formatForCsv(totalIncomeForEntry)); 
                                     }
                                     row.push(includeExpense ? '' : null); 
                                     row.push(formatForCsv(totalIncomeForEntry));
                                 } else {
                                     // 其他 item 行：金額欄位留空
                                     if (includeSurcharge) { 
                                         row.push('', '', ''); 
                                     } else { 
                                         row.push(''); 
                                     }
                                     row.push(includeExpense ? '' : null); 
                                     row.push(''); // 淨值也留空
                                 }
                                 
                                 const finalRow = row.filter(val => val !== null); 
                                 rows.push(finalRow);
                                 
                                 processedEntries++;
                                 
                                 // 每處理 10 筆記錄，讓出控制權並更新進度
                                 if (processedEntries % 10 === 0 && totalEntries > 0) {
                                     setExportProgress(Math.floor((processedEntries / totalEntries) * 100));
                                     await new Promise(resolve => setTimeout(resolve, 0));
                                 }
                             }
                         } else {
                             // 如果沒有 items，生成一行（向後兼容）
                             const row = [
                                 dateKey, 
                                 '送貨', 
                                 entry.clientName || '', 
                                 '', 
                                 '', 
                                 formatForCsv(entry.weight) || '', 
                                 formatForCsv(entry.dropLocations) || '', 
                                 formatForCsv(entry.tripNumber) || '1', 
                                 entry.remark || ''
                             ];
                             
                             const tripNumber = parseInt(entry.tripNumber) || 1;
                             if (includeSurcharge) { 
                                 row.push(formatForCsv(details.weightCost)); 
                                 row.push(formatForCsv(shouldAddSurcharge && tripSurcharges[tripNumber] > 0 ? tripSurcharges[tripNumber] : '')); 
                                 row.push(formatForCsv(totalIncomeForEntry)); 
                             } else { 
                                 row.push(formatForCsv(totalIncomeForEntry)); 
                             }
                             row.push(includeExpense ? '' : null); 
                             row.push(formatForCsv(totalIncomeForEntry));
                             
                             const finalRow = row.filter(val => val !== null); 
                             rows.push(finalRow);
                             
                             processedEntries++;
                             
                             if (processedEntries % 10 === 0 && totalEntries > 0) {
                                 setExportProgress(Math.floor((processedEntries / totalEntries) * 100));
                                 await new Promise(resolve => setTimeout(resolve, 0));
                             }
                         }
                         
                     } else if (entry.type === 'fuel') {
                         // 油錢支出：只有一行
                         const row = [
                             dateKey, 
                             '油錢', 
                             '', 
                             '', 
                             '', 
                             '', 
                             '', 
                             '', // 趟數欄位留空
                             entry.remark || ''
                         ];
                         
                         const amount = Math.abs(netValue);
                         if (includeSurcharge) { 
                             row.push('', '', ''); 
                         } else { 
                             row.push(''); 
                         }
                         row.push(includeExpense ? formatForCsv(amount) : null); 
                         periodExpense += amount; 
                         row.push(formatForCsv(netValue));
                         
                         const finalRow = row.filter(val => val !== null); 
                         rows.push(finalRow);
                         
                         processedEntries++;
                         
                         if (processedEntries % 10 === 0 && totalEntries > 0) {
                             setExportProgress(Math.floor((processedEntries / totalEntries) * 100));
                             await new Promise(resolve => setTimeout(resolve, 0));
                         }
                     }
                  }
                  
                  // 如果選擇單獨顯示加價，則按趟數分別顯示
                  if (includeDailySurchargeAsSeparateEntry) {
                      Object.keys(tripSurcharges).sort((a, b) => parseInt(a) - parseInt(b)).forEach(tripNumber => {
                          const tripSurcharge = tripSurcharges[tripNumber];
                          if (tripSurcharge > 0) {
                              const surchargeAmount = formatForCsv(tripSurcharge);
                              const zero = formatForCsv(0);
                              const tripTotalDrops = trips[tripNumber];
                              let surchargeRow = [dateKey, '位數加價', '', '', '', '', formatForCsv(tripTotalDrops), tripNumber, `第${tripNumber}趟超 ${settings.dropThreshold} 位加價`];
                              if (includeSurcharge) { surchargeRow.push(zero); surchargeRow.push(surchargeAmount); surchargeRow.push(surchargeAmount); } else { surchargeRow.push(surchargeAmount); }
                              if (includeExpense) { surchargeRow.push(''); }
                              surchargeRow.push(surchargeAmount); 
                              rows.push(surchargeRow); 
                              periodIncome += tripSurcharge;
                          }
                      });
                  }
              }
            }
            
            // 添加總結
            if (includeTotalIncome || includeNetIncome) { 
              rows.push([]); 
              rows.push(['--- 期間總結 ---']); 
              if (includeTotalIncome) { 
                rows.push(['總收入 (送貨費)', formatForCsv(periodIncome)]); 
                rows.push(['總支出 (油錢費)', formatForCsv(periodExpense)]); 
              } 
              if (includeNetIncome) { 
                rows.push(['淨收入', formatForCsv(periodIncome - periodExpense)]); 
              } 
            }
            
            // 生成 CSV 並下載
            setExportProgress(100);
            const csvContent = "\uFEFF" + rows.map(e => e.join(",")).join("\n");
            const url = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
            const link = document.createElement("a"); 
            link.href = url; 
            link.download = `貨車記帳報表_${startDate}_${endDate}.csv`; 
            document.body.appendChild(link); 
            link.click(); 
            document.body.removeChild(link);
            
            setIsExporting(false);
            setExportProgress(0);
            onClose();
          };
          return (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-6"><div className="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl max-h-[90vh] overflow-y-auto"><div className="flex items-center gap-2 mb-4 text-gray-800"><Icon name="Download" className="w-5 h-5 text-green-600" /><h3 className="font-bold text-lg">匯出報表</h3></div><div className="space-y-4 mb-6 p-4 border rounded-xl bg-gray-50"><h4 className="text-sm font-bold text-gray-700 mb-2">選擇期間</h4><div className="flex flex-col space-y-3"><div><label className="block text-xs text-gray-500 mb-1">開始日期</label><input type="date" className="w-full p-2 text-sm bg-white rounded-lg border focus:ring-green-500 outline-none" value={startDate} onChange={(e) => setStartDate(e.target.value)} disabled={isExporting}/></div><div><label className="block text-xs text-gray-500 mb-1">結束日期</label><input type="date" className="w-full p-2 text-sm bg-white rounded-lg border focus:ring-green-500 outline-none" value={endDate} onChange={(e) => setEndDate(e.target.value)} disabled={isExporting}/></div></div></div><div className="space-y-3 mb-6 p-4 border rounded-xl"><h4 className="text-sm font-bold text-gray-700 mb-3">報表內容選項</h4><CheckboxItem label="輸出位數加價細節" checked={exportOptions.includeSurcharge} onChange={() => handleOptionChange('includeSurcharge')} helpText="細分基本運費和位數加價欄位。" disabled={isExporting}/><CheckboxItem label="將總加價單獨列出" checked={exportOptions.includeDailySurchargeAsSeparateEntry} onChange={() => handleOptionChange('includeDailySurchargeAsSeparateEntry')} helpText="每日總加價會獨立成為一筆紀錄，否則會加到當天第一筆送貨收入中。" disabled={isExporting}/><CheckboxItem label="輸出支出金額" checked={exportOptions.includeExpense} onChange={() => handleOptionChange('includeExpense')} helpText="輸出油錢等支出紀錄。" disabled={isExporting}/><CheckboxItem label="期間總收入/總支出" checked={exportOptions.includeTotalIncome} onChange={() => handleOptionChange('includeTotalIncome')} helpText="在報表末尾彙總期間的總收入與總支出。" disabled={isExporting}/><CheckboxItem label="期間淨收入" checked={exportOptions.includeNetIncome} onChange={() => handleOptionChange('includeNetIncome')} helpText="在報表末尾彙總期間的淨收入 (總收入-總支出)。" disabled={isExporting}/></div>{isExporting && <div className="mb-6 p-4 border rounded-xl bg-blue-50"><div className="text-sm text-blue-700 mb-2 font-medium">正在生成 CSV... {exportProgress}%</div><div className="w-full bg-blue-200 rounded-full h-2"><div className="bg-blue-600 h-2 rounded-full transition-all duration-300" style={{ width: `${exportProgress}%` }}></div></div></div>}<div className="flex gap-3"><button onClick={onClose} className="flex-1 py-3 rounded-lg text-gray-500 hover:bg-gray-100 font-bold" disabled={isExporting}>取消</button><button onClick={exportToCSV} className="flex-1 py-3 rounded-lg bg-green-600 text-white font-bold shadow-lg shadow-green-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled={isExporting}>{isExporting ? (<><Icon name="Loader2" size={18} className="loader-spin" /> 生成中...</>) : '下載 CSV'}</button></div></div></div>
          );
        }

        // 渲染應用程式
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    </script>
</body>
</html>
